<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>တရုတ် Adjective အဘိဓာန်</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    body {
      background: #f5f2ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 820px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      padding: 28px 30px 34px;
      border: 1px solid #e4dfd8;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      border-bottom: 2px solid #dcd6cd;
      padding-bottom: 14px;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 550;
      color: #1e1a16;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header h1 i {
      color: #3d3d3d;
      font-size: 1.6rem;
    }

    .header .badge-count {
      background: #eae5de;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.9rem;
      color: #2f2a24;
      font-weight: 450;
    }

    .search-area {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .search-area .input-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      background: #f3f0eb;
      border-radius: 60px;
      padding: 0 18px;
      border: 1px solid #d6cfc5;
      transition: 0.1s;
    }

    .search-area .input-wrap:focus-within {
      border-color: #8f8a82;
      background: #faf8f5;
    }

    .search-area .input-wrap i {
      color: #5f5950;
      font-size: 1rem;
      margin-right: 8px;
    }

    #searchInput {
      border: none;
      background: transparent;
      padding: 14px 4px;
      font-size: 1rem;
      width: 100%;
      outline: none;
      color: #1c1814;
    }

    #searchInput::placeholder {
      color: #9a9288;
      font-weight: 350;
    }

    #searchBtn {
      background: #2e2a24;
      border: none;
      color: white;
      padding: 0 28px;
      border-radius: 60px;
      font-size: 1rem;
      font-weight: 450;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
      height: 54px;
      transition: 0.1s;
      border: 1px solid #2e2a24;
    }

    #searchBtn:hover {
      background: #1f1c17;
      border-color: #1f1c17;
    }

    #searchBtn:active {
      transform: scale(0.97);
    }

    .result-meta {
      font-size: 0.95rem;
      color: #3b362f;
      padding: 6px 4px 12px 4px;
      border-bottom: 1px solid #e8e2da;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    #resultMessage {
      font-weight: 420;
    }

    #resultCount {
      color: #5f5950;
      background: #ede8e1;
      padding: 0 14px;
      border-radius: 30px;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
    }

    #resultList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 2px;
    }

    #resultList li {
      display: grid;
      grid-template-columns: 70px 110px 1fr 50px;
      align-items: center;
      background: #faf8f5;
      padding: 10px 16px;
      border-radius: 12px;
      border-left: 4px solid #d6cfc5;
      font-size: 1rem;
      gap: 8px;
      border-bottom: 1px solid #ede8e1;
    }

    @media (max-width: 580px) {
      #resultList li {
        grid-template-columns: 1fr;
        gap: 2px;
        padding: 12px 16px;
        border-left-width: 4px;
      }
      #resultList li .badge {
        display: none;
      }
    }

    #resultList li .char {
      font-size: 1.7rem;
      font-weight: 500;
      color: #1c1814;
      letter-spacing: 1px;
    }

    #resultList li .pinyin {
      color: #3d3d3d;
      background: #eae5de;
      padding: 2px 12px;
      border-radius: 40px;
      font-weight: 450;
      text-align: center;
      font-size: 0.95rem;
    }

    #resultList li .meaning {
      color: #1c1814;
      font-weight: 400;
      padding: 2px 4px;
      word-break: break-word;
    }

    #resultList li .badge {
      color: #6f685e;
      font-size: 0.75rem;
      background: transparent;
      text-align: right;
      font-weight: 350;
    }

    .empty-state {
      grid-template-columns: 1fr !important;
      text-align: center;
      color: #6f685e;
      background: #f3f0eb !important;
      padding: 28px 12px !important;
      border-left-color: #b9b1a6 !important;
    }

    .empty-state i {
      margin-right: 10px;
      color: #9a9288;
    }

    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: #8a837a;
      border-top: 1px solid #e4dfd8;
      padding-top: 16px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    #resultList::-webkit-scrollbar {
      width: 5px;
    }
    #resultList::-webkit-scrollbar-track {
      background: #e8e2da;
      border-radius: 10px;
    }
    #resultList::-webkit-scrollbar-thumb {
      background: #c5bdb2;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1><i class="fas fa-book-open"></i> Adj. 中–缅</h1>

    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultList = document.getElementById('resultList');
    const resultMessage = document.getElementById('resultMessage');
    const resultCount = document.getElementById('resultCount');

    function renderResults(items) {
      resultList.innerHTML = '';
      if (!items || items.length === 0) {
        const li = document.createElement('li');
        li.className = 'empty-state';
        li.innerHTML = `<i class="fas fa-search-minus"></i> ကိုက်ညီသည့် adjective မတွေ့ပါ`;
        resultList.appendChild(li);
        resultCount.textContent = '၀ ခု';
        return;
      }

      items.forEach((item, index) => {
        const li = document.createElement('li');

        const charSpan = document.createElement('span');
        charSpan.className = 'char';
        charSpan.textContent = item.char;

        const pinyinSpan = document.createElement('span');
        pinyinSpan.className = 'pinyin';
        pinyinSpan.textContent = item.pinyin;

        const meaningSpan = document.createElement('span');
        meaningSpan.className = 'meaning';
        meaningSpan.textContent = item.meaning;

        const badge = document.createElement('span');
        badge.className = 'badge';
        badge.textContent = '#' + (index + 1);

        li.appendChild(charSpan);
        li.appendChild(pinyinSpan);
        li.appendChild(meaningSpan);
        li.appendChild(badge);
        resultList.appendChild(li);
      });

      resultCount.textContent = items.length + ' ခု';
    }

    function performSearch() {
      const query = searchInput.value.trim().toLowerCase();
      if (query === '') {
        renderResults(dictionary);
        resultMessage.innerHTML = `<i class="far fa-circle" style="margin-right: 6px;"></i> ရလဒ်အားလုံး (Adjective)`;
        return;
      }

      const filtered = dictionary.filter(item => {
        return item.char.toLowerCase().includes(query) ||
               item.pinyin.toLowerCase().includes(query) ||
               item.meaning.toLowerCase().includes(query);
      });

      renderResults(filtered);

      if (filtered.length === 0) {
        resultMessage.innerHTML = `<i class="fas fa-search-minus" style="margin-right: 6px;"></i> “${searchInput.value}” အတွက် မတွေ့ပါ`;
      } else {
        resultMessage.innerHTML = `<i class="fas fa-check" style="margin-right: 6px;"></i> “${searchInput.value}” အတွက် တွေ့ရှိချက်`;
      }
    }

    searchBtn.addEventListener('click', performSearch);
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        performSearch();
      }
    });

    // initial render
    renderResults(dictionary);
    resultMessage.innerHTML = `<i class="far fa-circle" style="margin-right: 6px;"></i> ရလဒ်အားလုံး (Adjective)`;
