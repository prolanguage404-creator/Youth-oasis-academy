    // ============== RENDER ENGINE =================
    const daySelect = document.getElementById('daySelect');
    const contentArea = document.getElementById('contentArea');
    const patternCountDisplay = document.getElementById('patternCountDisplay');

    function populateSpinner() {
        grammarData.forEach((item, index) => {
            const opt = document.createElement('option');
            opt.value = index;
            opt.textContent = item.day;
            daySelect.appendChild(opt);
        });
    }

    function renderDay(dayIndex) {
        const dayData = grammarData[dayIndex];
        if (!dayData) {
            contentArea.innerHTML = `<p style="color:#94a3b8;">No data for this day.</p>`;
            patternCountDisplay.textContent = 'Patterns: 0';
            return;
        }

        const patterns = dayData.patterns;
        patternCountDisplay.textContent = `Patterns: ${patterns.length}`;

        let html = `<div class="day-title">📖 ${dayData.day} <span>${patterns.length} patterns</span></div>`;

        patterns.forEach((pattern, idx) => {
            html += `
                <div class="pattern-card">
                    <div class="pattern-header">
                        <span class="pattern-structure">${pattern.structure}</span>
                        <span class="pattern-pinyin">${pattern.pinyin}</span>
                        <span class="badge-count">#${idx+1}</span>
                    </div>
                    <div class="pattern-meaning">${pattern.meaning}</div>
                    <div class="pattern-desc">${pattern.description}</div>
                    <div class="exercise-block">
                        <h4>📝 လေ့ကျင့်ခန်းများ (၅) <span style="font-weight:400;font-size:14px;color:#64748b;">Exercise</span></h4>
            `;
            pattern.exercises.forEach(ex => {
                html += `
                    <div class="exercise-item">
                        <span class="chinese">${ex.chinese}</span>
                        <span class="pinyin">${ex.pinyin}</span>
                        <span class="meaning">${ex.meaning}</span>
                        <span class="myanmar">🇲🇲 ${ex.meaning}</span>
                    </div>
                `;
            });
            html += `</div></div>`;
        });

        contentArea.innerHTML = html;
    }

    // =============== EVENT ====================
    daySelect.addEventListener('change', function() {
        const idx = parseInt(this.value);
        renderDay(idx);
    });

    // =============== INIT =====================
    populateSpinner();
    if (grammarData.length > 0) {
        daySelect.value = '0';
        renderDay(0);
    } else {
        contentArea.innerHTML = `<p>No grammar data available.</p>`;
    }
</script>
