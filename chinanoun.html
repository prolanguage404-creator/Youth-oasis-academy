        th:nth-child(4) { width: 45%; }
        td {

        }
        tbody tr:hover {
            background: #f0faf4;
        }
        tbody tr:last-child td {

        }
        .num {

            color: #888;
        }

    // ============================================================
    //  RENDER TABLE
    // ============================================================
    const tbody = document.getElementById('tableBody');

    function renderTable(data) {
        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="no-result">😕 ရှာတွေ့မရှိပါ</td></tr>`;
            return;
        }
        let html = '';
        data.forEach((v, index) => {
            const num = index + 1;
            html += `
                <tr>
                    <td class="num">${num}</td>
                    <td class="hanzi">${v.hanzi}</td>
                    <td class="pinyin">${v.pinyin}</td>
                    <td class="myanmar">${v.myanmar}</td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
    }

    // Initial render (all 50)
    renderTable(nouns);

    // ============================================================
    //  SEARCH / FILTER FUNCTION
    // ============================================================
    function filterTable() {
        const input = document.getElementById('searchInput');
        const keyword = input.value.trim().toLowerCase();
        if (keyword === '') {
            renderTable(nouns);
            return;
        }
        const filtered = nouns.filter(v => 
            v.hanzi.includes(keyword) ||
            v.pinyin.toLowerCase().includes(keyword) ||
            v.myanmar.toLowerCase().includes(keyword)
        );
        renderTable(filtered);
    }

    // ============================================================
    //  RESET SEARCH
    // ============================================================
    function resetSearch() {
        document.getElementById('searchInput').value = '';
        renderTable(nouns);
        document.getElementById('searchInput').focus();
    }

    // Enter key support
    document.getElementById('searchInput').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            filterTable();
        }
    });
</script>
