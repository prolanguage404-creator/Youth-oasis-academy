    <script>
        // =============================================================
        //  DATA: A2 Level - Lessons 1-20
        // =============================================================
        const lessons = {
            lesson1: {
                title: "Lesson 1: Talking About Past Experiences (အတိတ်အတွေ့အကြုံများအကြောင်းပြောခြင်း)",
                dialog: [
                    { speaker: "A", en: "Have you ever traveled to another country?", my: "မင်း တစ်ခါမှ နိုင်ငံခြားကို ခရီးသွားဖူးလား။" },
                    { speaker: "B", en: "Yes, I have! I visited Japan three years ago.", my: "ဟုတ်တယ်၊ သွားဖူးတယ်။ ကျွန်တော် သုံးနှစ်အကြာက ဂျပန်ကိုသွားခဲ့တယ်။" },
                    { speaker: "A", en: "That sounds amazing! What did you do there?", my: "သိပ်ကောင်းတယ်နော်။ အဲဒီမှာ မင်း ဘာတွေလုပ်ခဲ့လဲ။" },
                    { speaker: "B", en: "I visited Tokyo and Kyoto. I also tried authentic Japanese food.", my: "ကျွန်တော် တိုကျိုနဲ့ ကျိုတိုကိုသွားလည်ခဲ့တယ်။ စစ်မှန်တဲ့ဂျပန်အစားအစာလည်း စားကြည့်ခဲ့တယ်။" },
                    { speaker: "A", en: "Which city did you prefer?", my: "မင်း ဘယ်မြို့ကို ပိုကြိုက်လဲ။" },
                    { speaker: "B", en: "I preferred Kyoto because it's more traditional and peaceful.", my: "ကျိုတိုကို ပိုကြိုက်တယ်၊ ဘာဖြစ်လို့လဲဆိုတော့ ပိုရိုးရာဆန်ပြီး ငြိမ်းချမ်းလို့ပဲ။" },
                    { speaker: "A", en: "Have you ever been to Europe?", my: "မင်း ဥရောပကို သွားဖူးလား။" },
                    { speaker: "B", en: "Not yet, but I would love to visit France and Italy one day.", my: "မသွားဖူးသေးဘူး၊ ဒါပေမယ့် တစ်နေ့မှာ ပြင်သစ်နဲ့ အီတလီကို သွားလည်ချင်တယ်။" },
                    { speaker: "A", en: "Why do you want to visit those countries?", my: "မင်း ဘာလို့ အဲဒီနိုင်ငံတွေကို သွားချင်တာလဲ။" },
                    { speaker: "B", en: "Because I want to see famous landmarks and taste their cuisine.", my: "ဘာဖြစ်လို့လဲဆိုတော့ ကျွန်တော် ကျော်ကြားတဲ့နေရာတွေကို မြင်ချင်ပြီး သူတို့ရဲ့အစားအစာတွေကို စားချင်လို့ပဲ။" },
                    { speaker: "A", en: "Speaking of food, have you tried Italian food before?", my: "အစားအစာအကြောင်းပြောရရင်၊ မင်း အီတလီအစားအစာကို အရင်စားဖူးလား။" },
                    { speaker: "B", en: "Yes, I have eaten pizza and pasta many times, but I want to try authentic Italian pizza.", my: "ဟုတ်တယ်၊ ကျွန်တော် ပီဇာနဲ့ ပါဆတာတွေ အကြိမ်ပေါင်းများစွာ စားဖူးတယ်၊ ဒါပေမယ့် စစ်မှန်တဲ့အီတလီပီဇာကို စားချင်တယ်။" },
                    { speaker: "A", en: "I agree! Authentic food is always better.", my: "ကျွန်တော် သဘောတူတယ်။ စစ်မှန်တဲ့အစားအစာက အမြဲတမ်း ပိုကောင်းတယ်။" },
                    { speaker: "B", en: "Have you ever traveled abroad?", my: "မင်း နိုင်ငံခြားကို ခရီးသွားဖူးလား။" },
                    { speaker: "A", en: "Yes, I went to Singapore last year. It was an unforgettable experience.", my: "ဟုတ်တယ်၊ ကျွန်တော် မနှစ်က စင်ကာပူကိုသွားခဲ့တယ်။ မေ့မရနိုင်တဲ့အတွေ့အကြုံတစ်ခုပါ။" },

                    { en: "I think it's wise to save for the future.", my: "အနာဂတ်အတွက်စုဖို့ ပညာရှိရှိဖြစ်တယ်လို့ ကျွန်တော်ထင်တယ်။" },
                    { en: "I think it's necessary to track expenses.", my: "အသုံးစရိတ်တွေကို ခြေရာခံဖို့ လိုအပ်တယ်လို့ ကျွန်တော်ထင်တယ်။" }
                ]
            },
            {
                formula: "Subject + try to + V1 + Object (Expressing effort)",
                meaning: "အကြောင်းအရာ + ...ဖို့ ကြိုးစားတယ် (ကြိုးပမ်းမှုဖော်ပြခြင်း)",
                explanation: "'Try to' က တစ်စုံတစ်ခုလုပ်ဖို့ ကြိုးစားတယ်ဆိုတာကို ဖော်ပြတယ်။",
                examples: [
                    { en: "I try to save 20% of my income.", my: "ကျွန်တော် ဝင်ငွေရဲ့ ၂၀ ရာခိုင်နှုန်းကို စုဖို့ ကြိုးစားတယ်။" },
                    { en: "She tries to cook at home.", my: "သူမ အိမ်မှာချက်ဖို့ ကြိုးစားတယ်။" },
                    { en: "He tries to avoid impulse buying.", my: "သူ စိတ်ကူးယဉ်ဝယ်ယူမှုကို ရှောင်ဖို့ ကြိုးစားတယ်။" },
                    { en: "They try to compare prices.", my: "သူတို့ ဈေးနှုန်းတွေ နှိုင်းယှဉ်ဖို့ ကြိုးစားတယ်။" },
                    { en: "We try to plan our expenses.", my: "ငါတို့ အသုံးစရိတ်တွေကို စီစဉ်ဖို့ ကြိုးစားတယ်။" }
                ]
            },
            {
                formula: "Subject + spend + money + on + Object (Describing spending)",
                meaning: "အကြောင်းအရာ + ပိုက်ဆံ + ...အတွက် သုံးသည် (အသုံးစရိတ်ဖော်ပြခြင်း)",
                explanation: "'Spend on' က ငွေကို ဘာအတွက်သုံးတယ်ဆိုတာကို ဖော်ပြတယ်။",
                examples: [
                    { en: "I spend most of my money on rent and food.", my: "ကျွန်တော် ပိုက်ဆံအများစုကို အိမ်ငှားခနဲ့ အစားအစာအတွက် သုံးတယ်။" },
                    { en: "She spends money on clothes.", my: "သူမ အဝတ်အစားတွေအတွက် ပိုက်ဆံသုံးတယ်။" },
                    { en: "He spends money on transportation.", my: "သူ သယ်ယူပို့ဆောင်ရေးအတွက် ပိုက်ဆံသုံးတယ်။" },
                    { en: "They spend money on entertainment.", my: "သူတို့ ဖျော်ဖြေရေးအတွက် ပိုက်ဆံသုံးတယ်။" },
                    { en: "We spend money on groceries.", my: "ငါတို့ ကုန်စုံအတွက် ပိုက်ဆံသုံးတယ်။" }
                ]
            },
            {
                formula: "Subject + be + saving up to + V1 + time (Expressing savings goal)",
                meaning: "အကြောင်းအရာ + ...ဖို့ + အချိန် + ပိုက်ဆံစုနေတယ် (စုဆောင်းမှုရည်မှန်းချက်ဖော်ပြခြင်း)",
                explanation: "'Saving up to' က ဘာအတွက် ပိုက်ဆံစုနေတယ်ဆိုတာကို ဖော်ပြတယ်။",
                examples: [
                    { en: "I'm saving up to buy a car next year.", my: "ကျွန်တော် လာမယ့်နှစ် ကားဝယ်ဖို့ ပိုက်ဆံစုနေတယ်။" },
                    { en: "She's saving up to travel abroad.", my: "သူမ ပြည်ပခရီးသွားဖို့ ပိုက်ဆံစုနေတယ်။" },
                    { en: "He's saving up to buy a house.", my: "သူ အိမ်ဝယ်ဖို့ ပိုက်ဆံစုနေတယ်။" },
                    { en: "They're saving up for a vacation.", my: "သူတို့ အားလပ်ရက်အတွက် ပိုက်ဆံစုနေတယ်။" },
                    { en: "We're saving up to start a business.", my: "ငါတို့ စီးပွားရေးလုပ်ငန်းစဖို့ ပိုက်ဆံစုနေတယ်။" }
                ]
            },
            {
                formula: "Subject + have/has + already + V3 (Completed saving)",
                meaning: "အကြောင်းအရာ + ...ပြီးသားပါ (ပြီးဆုံးသွားခြင်းဖော်ပြခြင်း)",
                explanation: "'Already' က လက်ရှိအချိန်မတိုင်ခင် ပြီးသွားတဲ့အရာကို ဖော်ပြတယ်။",
                examples: [
                    { en: "I've already saved half of it.", my: "ကျွန်တော် တစ်ဝက်လောက် စုပြီးသားပါ။" },
                    { en: "She has already reached her goal.", my: "သူမ သူ့ရည်မှန်းချက်ကို ပြီးသွားပြီ။" },
                    { en: "He has already bought a car.", my: "သူ ကားဝယ်ပြီးသားပါ။" },
                    { en: "They have already saved enough.", my: "သူတို့ လုံလောက်အောင် စုပြီးသားပါ။" },
                    { en: "We have already planned our budget.", my: "ငါတို့ ဘတ်ဂျက်ကို စီစဉ်ပြီးသားပါ။" }
                ]
            },
            {
                formula: "Subject + should + avoid + V-ing (Giving advice)",
                meaning: "အကြောင်းအရာ + ...ရှောင်သင့်တယ် (အကြံပေးခြင်း)",
                explanation: "'Avoid' က တစ်စုံတစ်ခုကို ရှောင်ရှားဖို့ အကြံပေးတဲ့အခါ သုံးတယ်။",
                examples: [
                    { en: "You should avoid impulse buying.", my: "မင်း စိတ်ကူးယဉ်ဝယ်ယူမှုကို ရှောင်သင့်တယ်။" },
                    { en: "You should avoid spending too much.", my: "မင်း အများကြီးသုံးတာကို ရှောင်သင့်တယ်။" },
                    { en: "You should avoid eating out too often.", my: "မင်း မကြာခဏ အပြင်စားတာကို ရှောင်သင့်တယ်।" },
                    { en: "You should avoid taking on debt.", my: "မင်း ကြွေးမြီယူတာကို ရှောင်သင့်တယ်။" },
                    { en: "You should avoid unnecessary expenses.", my: "မင်း မလိုအပ်တဲ့အသုံးစရိတ်တွေကို ရှောင်သင့်တယ်။" }
                ]
            },
            {
                formula: "Subject + agree + that + clause (Expressing agreement)",
                meaning: "အကြောင်းအရာ + သဘောတူတယ် + that + အပိုဒ် (သဘောတူညီမှုဖော်ပြခြင်း)",
                explanation: "'Agree that' က တစ်စုံတစ်ခုကို သဘောတူတယ်ဆိုတာကို ဖော်ပြတယ်။",
                examples: [
                    { en: "I agree that it's good to compare prices.", my: "ဈေးနှုန်းတွေနှိုင်းယှဉ်တာ ကောင်းတယ်ဆိုတာ ကျွန်တော် သဘောတူတယ်।" },
                    { en: "She agrees that saving is important.", my: "စုတာက အရေးကြီးတယ်ဆိုတာ သူမ သဘောတူတယ်။" },
                    { en: "He agrees that we should plan expenses.", my: "ငါတို့ အသုံးစရိတ်တွေကို စီစဉ်သင့်တယ်ဆိုတာ သူ သဘောတူတယ်।" },
                    { en: "They agree that cooking at home saves money.", my: "အိမ်မှာချက်တာက ပိုက်ဆံစုတယ်ဆိုတာ သူတို့ သဘောတူတယ်။" },
                    { en: "We agree that we should have a budget.", my: "ငါတို့ ဘတ်ဂျက်ရှိသင့်တယ်ဆိုတာ ငါတို့ သဘောတူတယ်။" }
                ]
            },
            {
                formula: "Subject + think + it's + good + to + V1 (Expressing opinion)",
                meaning: "အကြောင်းအရာ + ...ဖို့ + ကောင်းတယ်လို့ ထင်တယ် (ထင်မြင်ချက်ဖော်ပြခြင်း)",
                explanation: "ဒီပုံစံက တစ်စုံတစ်ခုလုပ်တာက ကောင်းတယ်လို့ ထင်တဲ့အခါ သုံးတယ်။",
                examples: [
                    { en: "I think it's good to compare prices.", my: "ဈေးနှုန်းတွေ နှိုင်းယှဉ်တာက ကောင်းတယ်လို့ ကျွန်တော်ထင်တယ်။" },
                    { en: "I think it's good to have a budget.", my: "ဘတ်ဂျက်ရှိဖို့ ကောင်းတယ်လို့ ကျွန်တော်ထင်တယ်।" },
                    { en: "I think it's good to save regularly.", my: "ပုံမှန်စုဖို့ ကောင်းတယ်လို့ ကျွန်တော်ထင်တယ်။" },
                    { en: "I think it's good to track expenses.", my: "အသုံးစရိတ်တွေ ခြေရာခံဖို့ ကောင်းတယ်လို့ ကျွန်တော်ထင်တယ်।" },
                    { en: "I think it's good to plan for the future.", my: "အနာဂတ်အတွက် စီစဉ်ဖို့ ကောင်းတယ်လို့ ကျွန်တော်ထင်တယ်။" }
                ]
            },
            {
                formula: "Small savings add up over time (Expressing cumulative benefit)",
                meaning: "သေးငယ်တဲ့စုဆောင်းမှုတွေက အချိန်ကြာလာတာနဲ့အမျှ စုပုံလာတယ် (စုပုံလာမှုဖော်ပြခြင်း)",
                explanation: "ဒီအသုံးအနှုန်းက သေးငယ်တဲ့ စုဆောင်းမှုတွေရဲ့ ရေရှည်အကျိုးကျေးဇူးကို ဖော်ပြတယ်။",
                examples: [
                    { en: "Small savings add up over time.", my: "သေးငယ်တဲ့စုဆောင်းမှုတွေက အချိန်ကြာလာတာနဲ့အမျှ စုပုံလာတယ်။" },
                    { en: "Every little bit helps.", my: "နည်းနည်းချင်းစီက ကူညီတယ်။" },
                    { en: "Saving a little each month adds up.", my: "တစ်လကို နည်းနည်းစုတာက စုပုံလာတယ်။" },
                    { en: "Small changes make a big difference.", my: "သေးငယ်တဲ့ပြောင်းလဲမှုတွေက ကြီးမားတဲ့ခြားနားမှုကို ဖန်တီးတယ်။" },
                    { en: "Little by little, you can reach your goal.", my: "နည်းနည်းချင်းစီနဲ့ မင်းရည်မှန်းချက်ကို ရောက်နိုင်တယ်။" }
                ]
            },
            {
                formula: "Subject + need + amount + to + V1 (Expressing financial need)",
                meaning: "အကြောင်းအရာ + ဈေးနှုန်း + လိုအပ်တယ် + to + ကြိယာ (ဘဏ္ဍာရေးလိုအပ်ချက်ဖော်ပြခြင်း)",
                explanation: "'Need' က တစ်စုံတစ်ခုအတွက် ဘယ်လောက်လိုတယ်ဆိုတာကို ဖော်ပြတယ်။",
                examples: [
                    { en: "I need around $10,000 to buy a car.", my: "ကားဝယ်ဖို့ ကျွန်တော် ဒေါ်လာ ၁၀၀၀၀ လောက်လိုတယ်။" },
                    { en: "She needs $500 to buy a new phone.", my: "ဖုန်းအသစ်ဝယ်ဖို့ သူမ ဒေါ်လာ ၅၀၀ လိုတယ်။" },
                    { en: "He needs $1,000 for the trip.", my: "ခရီးအတွက် သူ ဒေါ်လာ ၁၀၀၀ လိုတယ်။" },
                    { en: "They need $2,000 for rent.", my: "အိမ်ငှားခအတွက် သူတို့ ဒေါ်လာ ၂၀၀၀ လိုတယ်။" },
                    { en: "We need $500 for groceries.", my: "ကုန်စုံအတွက် ငါတို့ ဒေါ်လာ ၅၀၀ လိုတယ်။" }
                ]
            }
        ]
    },
    questions: [
        { q: "Does the man think it's important to save money?", a: "Yes, he definitely thinks so." },
        { q: "How much does the man try to save each month?", a: "He tries to save about 20% of his income." },
        { q: "What does the man spend most of his money on?", a: "He spends most of his money on rent, food, and transportation." },
        { q: "Does the man have a budget?", a: "Yes, he makes a monthly budget." },
        { q: "What does the man do to save money on food?", a: "He tries to cook at home instead of eating out." },
        { q: "Where does the man watch movies?", a: "He watches movies at home instead of going to the cinema." },
        { q: "What is the man's financial goal?", a: "He is saving up to buy a car next year." },
        { q: "How much does the man need to save for the car?", a: "He needs around $10,000." },
        { q: "How much has the man already saved?", a: "He has already saved half of it." },
        { q: "What does the man suggest to avoid?", a: "He suggests avoiding impulse buying." }
    ],
    creative: [
        { q: "What is your biggest financial goal and how are you saving for it?", a: "My biggest financial goal is [goal]. I am saving for it by [method]." },
        { q: "What are some ways you save money in your daily life?", a: "I save money by [way1], [way2], and [way3]." },
        { q: "Do you think it's better to spend money on experiences or things? Why?", a: "I think it's better to spend money on [experiences/things] because [reason]." }

},
lesson13: {
    title: "Lesson 13: Talking About Problems & Solutions (ပြဿနာများနှင့် ဖြေရှင်းနည်းများအကြောင်းပြောခြင်း)",
    dialog: [
        { speaker: "A", en: "I have a problem with my computer. It's really slow.", my: "ကျွန်တော့်ကွန်ပျူတာမှာ ပြဿနာရှိတယ်။ အရမ်းနှေးတယ်။" },
        { speaker: "B", en: "That's frustrating! How long has it been slow?", my: "စိတ်အနှောင့်အယှက်ဖြစ်စရာပဲနော်။ ဘယ်လောက်ကြာကြာ နှေးနေတာလဲ။" },
        { speaker: "A", en: "It's been slow for about two weeks now.", my: "နှစ်ပတ်လောက်ကြာပြီ နှေးနေတာ။" },
        { speaker: "B", en: "Have you tried restarting it?", my: "မင်း ပြန်ဖွင့်ကြည့်ဖူးလား။" },
        { speaker: "A", en: "Yes, I restarted it several times, but it didn't help.", my: "ဟုတ်တယ်၊ အကြိမ်ပေါင်းများစွာ ပြန်ဖွင့်ကြည့်တယ်၊ ဒါပေမယ့် မသက်သာဘူး။" },
        { speaker: "B", en: "Maybe you should delete some files. Your hard drive might be full.", my: "မင်း ဖိုင်တွေ ဖျက်သင့်တယ်။ မင်းရဲ့ hard drive ပြည့်နေနိုင်တယ်။" },
        { speaker: "A", en: "That's a good idea. I'll try to free up some space.", my: "စိတ်ကူးကောင်းပဲ။ နေရာလွတ်တွေ ရှင်းဖို့ ကြိုးစားမယ်။" },
        { speaker: "B", en: "If that doesn't work, you could run a virus scan.", my: "အဲဒါ အဆင်မပြေရင် မင်း ဗိုင်းရပ်စ်စစ်ဆေးတာ လုပ်လို့ရတယ်။" },

        // =============================================================
        //  Spinner ထဲကို Option တွေထည့်မယ်
        // =============================================================
        const selectEl = document.getElementById('lessonSelect');
        const displayEl = document.getElementById('lessonDisplay');

        const lessonKeys = Object.keys(lessons);

        lessonKeys.forEach((key, index) => {
            const option = document.createElement('option');
            option.value = key;
            option.textContent = `Lesson ${index + 1}: ${lessons[key].title}`;
            selectEl.appendChild(option);
        });

        // --------------------------------------------------------------
        //  Function: စာလုံးတွေကို ပုံမှန်ပြန်ဖြစ်အောင်
        // --------------------------------------------------------------
        function normalizeText(text) {
            return text.toLowerCase().replace(/\s+/g, ' ').trim();
        }

        // --------------------------------------------------------------
        //  Function: Lesson ပြောင်းပြမယ်
        // --------------------------------------------------------------
        function showLesson(lessonKey) {
            const data = lessons[lessonKey];
            if (!data) return;

            // === Dialog ===
            let dialogEnHtml = '';
            let dialogMyHtml = '';
            data.dialog.forEach(line => {
                if (line.speaker === 'A') {
                    dialogEnHtml += `<span class="speaker-a">${line.speaker}:</span> ${line.en}<br>`;
                    dialogMyHtml += `<span style="color:#74b9ff;">${line.speaker}:</span> ${line.my}<br>`;
                } else {
                    dialogEnHtml += `<span class="speaker-b">${line.speaker}:</span> ${line.en}<br>`;
                    dialogMyHtml += `<span style="color:#fd79a8;">${line.speaker}:</span> ${line.my}<br>`;
                }
            });

            // === Vocabulary ===
            let vocabHtml = '';
            data.vocab.forEach(v => {
                vocabHtml += `
                    <span class="vocab-tag">
                        ${v.word}
                        <span class="pron">[${v.pron}]</span>
                        <span class="meaning">- ${v.meaning}</span>
                    </span>
                `;
            });

            // === Grammar ===
            let grammarHtml = `<div class="grammar-title">📖 ${data.grammar.title}</div>`;
            data.grammar.patterns.forEach((p, idx) => {
                let exHtml = '';
                p.examples.forEach((ex, exIdx) => {
                    exHtml += `
                        <div class="ex">
                            <span class="num">${exIdx + 1}.</span> ${ex.en}
                            <span class="ex-meaning">🇲🇲 ${ex.my}</span>
                        </div>
                    `;
                });
                grammarHtml += `
                    <div class="grammar-item">
                        <div class="pattern">📌 ${p.formula}</div>
                        <div style="color:#888; font-size:0.85rem; margin-bottom:6px;">🎯 ${p.meaning}</div>
                        <div class="explanation">💡 ${p.explanation}</div>
                        ${exHtml}
                    </div>
                `;
            });

            // === Questions ===
            let questionsHtml = '';
            data.questions.forEach((item, idx) => {
                const qId = `q_${idx}`;
                questionsHtml += `
                    <div class="q-item">
                        <span class="q-num">${idx + 1}.</span> ${item.q}
                        <div class="q-row">
                            <textarea id="${qId}" placeholder="✍️ Write your answer here..." rows="2"></textarea>
                            <button class="btn-check" onclick="checkAnswer('${qId}', '${item.a}')">✅ Check</button>
                        </div>
                        <div id="${qId}_result" class="q-result"></div>
                    </div>
                `;
            });

            // === Creative Thinking ===
            let creativeHtml = '';
            data.creative.forEach((item, idx) => {
                const cId = `c_${idx}`;
                creativeHtml += `
                    <div class="c-item">
                        <span style="color:#fdcb6e; font-weight:600;">${idx + 1}.</span> ${item.q}
                        <div class="c-row">
                            <textarea id="${cId}" placeholder="✍️ Write your response here..." rows="3"></textarea>
                            <button class="btn-check-c" onclick="checkCreative('${cId}', '${item.a}')">✅ Check</button>
                        </div>
                        <div id="${cId}_result" class="c-result"></div>
                    </div>
                `;
            });

            // === Combine All ===
            displayEl.innerHTML = `
                <div class="title">${data.title}</div>

                <div class="dialog-section">
                    <div class="dialog-en">${dialogEnHtml}</div>
                    <div class="dialog-my"><span class="label">🇲🇲 မြန်မာပြန်</span>${dialogMyHtml}</div>
                </div>

                <hr class="section-divider">

                <div class="vocab-section">
                    <div class="vocab-title">📝 Vocabulary (မီးနင်းများ)</div>
                    <div class="vocab-list">${vocabHtml}</div>
                </div>

                <hr class="section-divider">

                <div class="grammar-section">${grammarHtml}</div>

                <hr class="section-divider">

                <div class="questions-section">
                    <div class="q-title">❓ Questions (ဖြေဆိုပါ - စစ်ပေးမယ်)</div>
                    ${questionsHtml}
                </div>

                <hr class="section-divider">

                <div class="creative-section">
                    <div class="c-title">💡 Creative Thinking (ကိုယ်ပိုင်စဉ်းစားခိုင်းခြင်း)</div>
                    ${creativeHtml}
                </div>
            `;
        }

        // --------------------------------------------------------------
        //  Function: Answer စစ်ပေးမယ်
        // --------------------------------------------------------------
        function checkAnswer(inputId, correctAnswer) {
            const input = document.getElementById(inputId);
            const result = document.getElementById(`${inputId}_result`);
            const userAnswer = normalizeText(input.value);

            if (!userAnswer) {
                result.className = 'q-result wrong';
                result.innerHTML = '⚠️ Please write your answer first!';
                return;
            }

            const correct = normalizeText(correctAnswer);

            if (userAnswer === correct) {
                result.className = 'q-result correct';
                result.innerHTML = '✅ Correct! Great job! 🎉';
            } else {
                result.className = 'q-result wrong';
                result.innerHTML = `❌ Not quite. The correct answer is: <span class="correct-answer">"${correctAnswer}"</span>`;
            }
        }

        // --------------------------------------------------------------
        //  Function: Creative Answer စစ်ပေးမယ်
        // --------------------------------------------------------------
        function checkCreative(inputId, correctAnswer) {
            const input = document.getElementById(inputId);
            const result = document.getElementById(`${inputId}_result`);
            const userAnswer = normalizeText(input.value);

            if (!userAnswer) {
                result.className = 'c-result wrong';
                result.innerHTML = '⚠️ Please write your response first!';
                return;
            }

            const correct = normalizeText(correctAnswer);
            const words = correct.split(' ');
            let matchCount = 0;

            words.forEach(w => {
                if (w.length > 2 && userAnswer.includes(w)) {
                    matchCount++;
                }
            });

            const matchRatio = matchCount / words.length;

            if (matchRatio > 0.4) {
                result.className = 'c-result correct';
                result.innerHTML = '✅ Great answer! 🎉<br><span style="color:#888;font-size:0.85rem;">💡 Suggested answer: ' + correctAnswer + '</span>';
            } else {
                result.className = 'c-result wrong';
                result.innerHTML = `💡 Try this: <span class="correct-answer">"${correctAnswer}"</span>`;
            }
        }

        // --------------------------------------------------------------
        //  Spinner ပြောင်းတိုင်း Lesson ပြောင်းမယ်
        // --------------------------------------------------------------
        selectEl.addEventListener('change', function() {
            showLesson(this.value);
        });

        // --------------------------------------------------------------
        //  Page load မှာ ပထမဆုံး Lesson ပြမယ်
        // --------------------------------------------------------------
        showLesson('lesson1');

        console.log('✅ A2 Lessons loaded:', lessonKeys.length);
    </script>
