    <script>
        // =============================================================
        //  DATA: B1 Level - Lessons 1-20
        // =============================================================
        const lessons = {
            lesson1: {
                title: "Lesson 1: Making Requests & Offers (တောင်းဆိုခြင်းနှင့် ကမ်းလှမ်းခြင်း)",
                dialog: [
                    { speaker: "A", en: "Would you mind helping me with this project?", my: "ဒီပရောဂျက်ကို ကူညီပေးဖို့ စိတ်မရှိဘူးလား။" },
                    { speaker: "B", en: "Not at all. I'd be happy to help. What do you need?", my: "လုံးဝမရှိပါဘူး။ ကျွန်တော် ဝမ်းသာပါတယ်။ ဘာလိုအပ်လဲ။" },
                    { speaker: "A", en: "Could you please take a look at this report?", my: "ဒီအစီရင်ခံစာကို ကြည့်ပေးနိုင်မလား။" },
                    { speaker: "B", en: "Sure, I can do that. Is there anything specific you want me to check?", my: "ရပါတယ်။ သီးခြားစစ်ဆေးစေချင်တာတစ်ခုခုရှိလား။" },
                    { speaker: "A", en: "Could you check the numbers and the grammar, please?", my: "နံပါတ်တွေနဲ့ သဒ္ဒါကို စစ်ပေးနိုင်မလား။" },
                    { speaker: "B", en: "Of course. I'll do it right away. Would you like me to print it too?", my: "ဟုတ်ကဲ့။ ကျွန်တော် ချက်ချင်းလုပ်ပေးမယ်။ ပုံနှိပ်ဖို့လည်း လိုချင်လား။" },
                    { speaker: "A", en: "Yes, that would be great. And would you mind sending it to the team?", my: "ဟုတ်တယ်၊ ကောင်းမှာပဲ။ ပြီးတော့ အဖွဲ့ကို ပို့ပေးဖို့ စိတ်မရှိဘူးလား။" },
                    { speaker: "B", en: "Not at all. I'll send it as soon as I finish checking.", my: "လုံးဝမရှိပါဘူး။ ကျွန်တော် စစ်ပြီးတာနဲ့ ပို့ပေးမယ်။" },
                    { speaker: "A", en: "Would you mind working late tonight to finish it?", my: "ဒီညနေ နောက်ကျမှ အလုပ်လုပ်ဖို့ စိတ်မရှိဘူးလား။" },
                    { speaker: "B", en: "I don't mind at all. I can stay late. Would you like me to order dinner?", my: "လုံးဝစိတ်မရှိပါဘူး။ ကျွန်တော် နောက်ကျမှနေလို့ရတယ်။ ညစာမှာပေးဖို့ လိုချင်လား။" },
                    { speaker: "A", en: "That's very kind of you. Could you order pizza for everyone?", my: "သိပ်ကောင်းတယ်နော်။ လူတိုင်းအတွက် ပီဇာမှာပေးနိုင်မလား။" },
                    { speaker: "B", en: "Sure thing. I'll call the pizza place now. Would you mind if I use your phone?", my: "ရပါတယ်။ ကျွန်တော် အခုပဲ ပီဇာဆိုင်ကို ခေါ်မယ်။ မင်းဖုန်းသုံးလို့ရမလား။" },
                    { speaker: "A", en: "Go ahead. And thank you so much for your help.", my: "သုံးပါ။ ပြီးတော့ ကူညီတဲ့အတွက် အရမ်းကျေးဇူးပါ။" },
                    { speaker: "B", en: "Don't mention it. I'm happy to help.", my: "ဘာမှမဟုတ်ပါဘူး။ ကျွန်တော် ကူညီရတာ ဝမ်းသာပါတယ်။" }
                ],
                vocab: [
                    { word: "Would you mind", pron: "ဝုဒ် ယူး မိုင်", meaning: "...ဖို့ စိတ်မရှိဘူးလား" },
                    { word: "Not at all", pron: "နော့ အတ် အော်", meaning: "လုံးဝမရှိပါဘူး" },
                    { word: "I'd be happy to", pron: "အိုင် ဘီ ဟက်ပီ တူ", meaning: "ကျွန်တော် ဝမ်းသာပါတယ်" },
                    { word: "Could you", pron: "ကုဒ် ယူး", meaning: "...နိုင်မလား" },
                    { word: "Right away", pron: "ရိုက် အဝေး", meaning: "ချက်ချင်း" },
                    { word: "Would you like", pron: "ဝုဒ် ယူး လိုက်", meaning: "...လိုချင်လား" },

lesson3: {

        //  Function: စာလုံးတွေကို ပုံမှန်ပြန်ဖြစ်အောင်
        // --------------------------------------------------------------
        function normalizeText(text) {
            return text.toLowerCase().replace(/\s+/g, ' ').trim();
        }

        // --------------------------------------------------------------
        //  Function: Lesson ပြောင်းပြမယ်
        // --------------------------------------------------------------
        function showLesson(lessonKey) {
            const data = lessons[lessonKey];
            if (!data) return;

            // === Dialog ===
            let dialogEnHtml = '';
            let dialogMyHtml = '';
            data.dialog.forEach(line => {
                if (line.speaker === 'A') {
                    dialogEnHtml += `<span class="speaker-a">${line.speaker}:</span> ${line.en}<br>`;
                    dialogMyHtml += `<span style="color:#74b9ff;">${line.speaker}:</span> ${line.my}<br>`;
                } else {
                    dialogEnHtml += `<span class="speaker-b">${line.speaker}:</span> ${line.en}<br>`;
                    dialogMyHtml += `<span style="color:#fd79a8;">${line.speaker}:</span> ${line.my}<br>`;
                }
            });

            // === Vocabulary ===
            let vocabHtml = '';

                vocabHtml += `
                    <span class="vocab-tag">

                grammarHtml += `
                    <div class="grammar-item">
                        <div class="pattern">📌 ${p.formula}</div>
                        <div style="color:#888; font-size:0.85rem; margin-bottom:6px;">🎯 ${p.meaning}</div>
                        <div class="explanation">💡 ${p.explanation}</div>
                        ${exHtml}
                    </div>
                `;

        // --------------------------------------------------------------
        //  Function: Answer စစ်ပေးမယ်
        // --------------------------------------------------------------
        function checkAnswer(inputId, correctAnswer) {
            const input = document.getElementById(inputId);
            const result = document.getElementById(`${inputId}_result`);
            const userAnswer = normalizeText(input.value);

            if (!userAnswer) {
                result.className = 'q-result wrong';
                result.innerHTML = '⚠️ Please write your answer first!';
                return;
            }

            const correct = normalizeText(correctAnswer);

            if (userAnswer === correct) {
                result.className = 'q-result correct';
                result.innerHTML = '✅ Correct! Great job! 🎉';
            } else {
                result.className = 'q-result wrong';
                result.innerHTML = `❌ Not quite. The correct answer is: <span class="correct-answer">"${correctAnswer}"</span>`;
            }
        }

        // --------------------------------------------------------------
        //  Function: Creative Answer စစ်ပေးမယ်
        // --------------------------------------------------------------
        function checkCreative(inputId, correctAnswer) {
            const input = document.getElementById(inputId);
            const result = document.getElementById(`${inputId}_result`);
            const userAnswer = normalizeText(input.value);

            if (!userAnswer) {
                result.className = 'c-result wrong';
                result.innerHTML = '⚠️ Please write your response first!';
                return;
            }

            const correct = normalizeText(correctAnswer);
            const words = correct.split(' ');
            let matchCount = 0;

            words.forEach(w => {
                if (w.length > 2 && userAnswer.includes(w)) {
                    matchCount++;
                }
            });

            const matchRatio = matchCount / words.length;

            if (matchRatio > 0.4) {
                result.className = 'c-result correct';
                result.innerHTML = '✅ Great answer! 🎉<br><span style="color:#888;font-size:0.85rem;">💡 Suggested answer: ' + correctAnswer + '</span>';
            } else {
                result.className = 'c-result wrong';
                result.innerHTML = `💡 Try this: <span class="correct-answer">"${correctAnswer}"</span>`;
            }
        }

        // --------------------------------------------------------------
        //  Spinner ပြောင်းတိုင်း Lesson ပြောင်းမယ်
        // --------------------------------------------------------------
        selectEl.addEventListener('change', function() {
            showLesson(this.value);
        });

        // --------------------------------------------------------------
        //  Page load မှာ ပထမဆုံး Lesson ပြမယ်
        // --------------------------------------------------------------
        showLesson('lesson1');

        console.log('✅ B1 Lessons loaded:', lessonKeys.length);
    </script>
