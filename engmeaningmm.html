/* ============ LEVEL CONFIG ============ */
const levelColors = {
  A1: "#27ae60",
  A2: "#2980b9",
  B1: "#e67e22",
  B2: "#c0392b"
};

/* ============ BUILD DROPDOWN ============ */
const spinner = document.getElementById("daySpinner");
const days = Object.keys(data).map(Number).sort((a,b)=>a-b);
days.forEach(d => {
  const opt = document.createElement("option");
  opt.value = d;
  opt.textContent = "Day " + d;
  spinner.appendChild(opt);
});

/* ============ RENDER ============ */
const titleEl    = document.getElementById("tableTitle");
const progressEl = document.getElementById("progressText");
const bodyEl     = document.getElementById("tableBody");

function render(day) {
  const item = data[day];
  if (!item) return;

  titleEl.innerHTML =
    `Day ${day} – ${item.level} Vocabulary ` +
    `<span class="level-badge" style="background:${levelColors[item.level]}">${item.level}</span>`;

  progressEl.textContent =
    `ရက် ၂၀၀ အစီအစဉ် • ${item.level} အပိုင်း • စကားလုံး ${item.rows.length} လုံး`;

  bodyEl.innerHTML = "";
  item.rows.forEach((row, i) => {
    const tr = document.createElement("tr");
    tr.className = "fade-in";
    tr.style.animationDelay = (i * 0.015) + "s";
    tr.innerHTML =
      `<td>${i+1}</td>` +
      `<td class="english">${row[0]}</td>` +
      `<td class="pronun">${row[1]}</td>` +
      `<td>${row[2]}</td>`;
    bodyEl.appendChild(tr);
  });
}

/* ============ EVENTS ============ */
spinner.addEventListener("change", e => render(e.target.value));
render(1);
</script>
