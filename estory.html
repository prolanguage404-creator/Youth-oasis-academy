                en: `Once upon a time, there was a lion who lived in a big forest. The lion was very kind and gentle, unlike other lions who were fierce and dangerous. He never hurt any animal in the forest.

One day, a little mouse was running through the forest. Suddenly, the mouse fell into a deep hole. The mouse cried for help, but no one came. The kind lion heard the mouse's cries and came to help.

The lion saw the mouse in the hole and said, "Don't worry, little friend. I will help you." The lion gently put his big paw into the hole and lifted the mouse out. The mouse was very grateful and said, "Thank you, dear lion! If you ever need my help, I will help you."

The lion laughed and said, "How can a small mouse like you help a big lion like me?" The mouse smiled and said, "You never know!"

A few days later, the lion was walking in the forest when he stepped into a hunter's trap. A big net fell on him and trapped him. The lion roared loudly, but no one came to help him. The little mouse heard the lion's roar and ran to help.

The mouse saw the lion trapped in the net. He quickly chewed through the ropes with his sharp teeth. After a few minutes, the lion was free. The lion was amazed and said, "I was wrong, little friend. You saved my life! I will never forget your kindness."

                my: `ရှေးလွန်လေပြီးသောအခါက တောအုပ်ကြီးတစ်ခုမှာ ခြင်္သေ့တစ်ကောင် နေထိုင်တယ်။ ဒီခြင်္သေ့က အခြားခြင်္သေ့တွေလို ရက်စက်ပြီး သတ္တိကြီးတာမဟုတ်ဘဲ အရမ်းကြင်နာပြီး နူးညံ့တယ်။ သူဟာ တောအုပ်ထဲက ဘယ်တိရစ္ဆာန်ကိုမှ ဘယ်တော့မှ မထိခိုက်စေခဲ့ဘူး။

ကြွက်လေးက ခြင်္သေ့ကို ပိုက်ထဲမှာဖမ်းမိနေတာကိုမြင်တယ်။ သူက သူ့သွားချွန်တွေနဲ့ ကြိုးတွေကို လျင်မြန်စွာ ကိုက်ဖြတ်လိုက်တယ်။ မိနစ်အနည်းငယ်ကြာတော့ ခြင်္သေ့ လွတ်သွားတယ်။ ခြင်္သေ့က အံ့ဩသွားပြီး "ငါမှားသွားတယ် မိတ်ဆွေငယ်။ မင်း ငါ့အသက်ကို ကယ်လိုက်တယ်။ မင်းရဲ့ကြင်နာမှုကို ငါ ဘယ်တော့မှ မေ့မှာမဟုတ်ဘူး" လို့ပြောတယ်။

                my: `ရှေးလွန်လေပြီးသောအခါက ရွာငယ်လေးတစ်ရွာမှာ ဆင်းရဲသော သစ်ခုတ်သမားတစ်ယောက် နေထိုင်တယ်။ သူဟာ နေ့တိုင်း အစာအတွက် ရောင်းဖို့ တောအုပ်ထဲမှာ ထင်းခုတ်ပြီး ကြိုးစားအလုပ်လုပ်တယ်။

တစ်နေ့မှာ သူဟာ မြစ်အနီးမှာ ထင်းခုတ်နေစဉ် သူ့ပုဆိန်က လက်ကလွတ်ပြီး ရေနက်ထဲ ပြုတ်ကျသွားတယ်။ သစ်ခုတ်သမားက ပုဆိန်အသစ်ဝယ်ဖို့ ပိုက်ဆံမရှိတဲ့အတွက် အရမ်းဝမ်းနည်းသွားတယ်။

ရုတ်တရက် မြစ်ထဲကနေ မှော်နတ်သမီးတစ်ယောက် ပေါ်လာတယ်။ သူက "မင်းဘာလို့ အရမ်းဝမ်းနည်းနေတာလဲ" လို့ မေးတယ်။ သစ်ခုတ်သမားက သူ့ပုဆိန်ပျောက်ဆုံးသွားတဲ့အကြောင်း ပြောပြတယ်။

နတ်သမီးက ပြုံးပြီး "မပူပါနဲ့။ ငါမင်းကိုကူညီမယ်" လို့ပြောတယ်။ သူမဟာ လက်ကို ရေထဲနှစ်ပြီး ရွှေပုဆိန်တစ်လက်ကို ထုတ်လာတယ်။ "ဒါ မင်းရဲ့ပုဆိန်လား" လို့မေးတယ်။ သစ်ခုတ်သမားက "မဟုတ်ပါဘူး၊ အဲဒါ ကျွန်တော့်ဟာမဟုတ်ပါဘူး" လို့ပြောတယ်။

နတ်သမီးက နောက်တစ်ခါ လက်ကိုနှစ်ပြီး ငွေပုဆိန်တစ်လက်ကို ထုတ်လာတယ်။ "ဒါ မင်းရဲ့ပုဆိန်လား" လို့မေးတယ်။ သစ်ခုတ်သမားက "မဟုတ်ပါဘူး၊ အဲဒါလည်း ကျွန်တော့်ဟာမဟုတ်ပါဘူး" လို့ပြောတယ်။

နတ်သမီးက တတိယအကြိမ် လက်ကိုနှစ်ပြီး သံပုဆိန်ဟောင်းတစ်လက်ကို ထုတ်လာတယ်။ "ဒါ မင်းရဲ့ပုဆိန်လား" လို့မေးတယ်။ သစ်ခုတ်သမားက ပျော်ရွှင်စွာ "ဟုတ်ကဲ့! အဲဒါ ကျွန်တော့်ပုဆိန်ပါ" လို့ပြောတယ်။

            {
            id: 3,
            title: "The Greedy Dog",
            en: `Once upon a time, there was a greedy dog who lived in a small town. He was always hungry and wanted more food than he needed.
            
            One day, the dog stole a big piece of meat from a butcher's shop. He ran away quickly with the meat in his mouth.
            
            The dog came to a bridge that crossed a river. As he walked across the bridge, he looked down into the water. He saw another dog in the water with a big piece of meat in its mouth.
            
            The greedy dog thought, "That dog has a bigger piece of meat than mine! I want that meat too." He opened his mouth to bark at the other dog.
            
            But when he opened his mouth, his own piece of meat fell into the water. The other dog disappeared because it was only his reflection.
            
            The dog felt very sad and foolish. He lost his meat because of his greed. He went home with nothing and learned a valuable lesson.
            
            From that day on, the dog was never greedy again. He learned to be happy with what he had.`,
            my: `ရှေးလွန်လေပြီးသောအခါက မြို့ငယ်လေးတစ်မြို့မှာ လောဘကြီးတဲ့ခွေးတစ်ကောင် နေထိုင်တယ်။ သူဟာ အမြဲတမ်း ဗိုက်ဆာနေပြီး လိုအပ်တာထက် ပိုပြီး အစားကို အမြဲလိုချင်တယ်။

            {
            id: 4,
            title: "The Thirsty Crow",
            en: `One hot summer day, a thirsty crow was flying over the fields. He was very tired and his throat was dry. He needed water to drink.
            
            The crow looked everywhere for water. Finally, he saw a pot with a little water at the bottom. He flew down to the pot and tried to drink.
            
            But the water was too low. His beak could not reach the water. The crow was very sad and thought, "How can I get the water?"
            
            The clever crow looked around and saw some small stones. He had an idea. He picked up one stone and dropped it into the pot. The water came up a little.
            
            He kept picking up stones and dropping them into the pot. One by one, the water came up higher and higher. The crow worked very hard.
            
            Finally, the water reached the top of the pot. The crow could drink the water easily. He drank the water and felt very happy.
            
            The crow learned that if you try hard, you can solve any problem. He flew away feeling proud and smart.`,
            my: `တစ်နွေရာသီ ပူပြင်းတဲ့နေ့မှာ ရေငတ်နေတဲ့ ကျီးကန်းတစ်ကောင်ဟာ လယ်ကွင်းတွေအပေါ်မှာ ပျံသန်းနေတယ်။ သူဟာ အရမ်းပင်ပန်းပြီး လည်ချောင်းလည်း ခြောက်သွေ့နေတယ်။ သောက်ဖို့ ရေလိုအပ်နေတယ်။

            {
            id: 5,
            title: "The Fox and the Grapes",
            en: `One sunny afternoon, a hungry fox was walking through the forest. He had not eaten anything for a long time. He was looking for food everywhere.
            
            Suddenly, the fox saw a bunch of grapes hanging from a high vine. The grapes looked ripe and delicious. The fox's mouth started watering.
            
            The fox thought, "Those grapes look so sweet and juicy. I must have them!" He jumped up to reach the grapes, but they were too high. He jumped again and again, but he could not reach them.
            
            The fox was tired and frustrated. He tried jumping from different angles, but the grapes were still too high. He felt very sad.
            
            Finally, the fox gave up. He walked away and said to himself, "Those grapes are probably sour anyway. I don't want them."
            
            But deep down, the fox knew that the grapes were sweet. He pretended not to want them because he could not reach them. This is called "sour grapes" when people pretend not to want something they cannot have.
            
            The fox learned that it is better to admit defeat than to pretend. He walked away with his head held high, but his heart was heavy.`,
            my: `တစ်နေ့ နေသာတဲ့မွန်းလွဲပိုင်းမှာ ဆာနေတဲ့ မြေခွေးတစ်ကောင်ဟာ တောအုပ်ထဲမှာ လမ်းလျှောက်နေတယ်။ သူဟာ ကြာကြာအချိန်ကြာ တစ်ခုမှ မစားခဲ့ရဘူး။ သူဟာ နေရာတိုင်းမှာ အစားအစာရှာနေတယ်။
            
            ရုတ်တရက် မြေခွေးက မြင့်မားတဲ့နွယ်ပင်မှာ စပျစ်သီးအစုတစ်ခု လွဲချော်နေတာကို မြင်လိုက်တယ်။ စပျစ်သီးတွေက မှည့်ပြီး အရသာရှိပုံရတယ်။ မြေခွေးရဲ့ ပါးစပ်က တံတွေးတွေ ကျလာတယ်။

            {
            id: 6,
            title: "The Hare and the Tortoise",
            en: `In a beautiful forest, there lived a hare and a tortoise. The hare was very fast and proud. He often made fun of the tortoise because she was so slow.
            
            One day, the hare said, "You are so slow, tortoise! You can never win a race against me." The tortoise was calm and replied, "Why don't we have a race and see?"
            
            The hare laughed and agreed. All the animals in the forest came to watch the race. They were excited to see who would win.
            
            The race began. The hare ran very fast and soon was far ahead. He looked back and saw the tortoise slowly moving behind him. The hare thought, "I have plenty of time. I will take a nap."
            
            The hare lay down under a tree and fell asleep. The tortoise kept walking slowly but steadily. She never stopped or gave up.
            
            While the hare was sleeping, the tortoise passed him. She kept moving forward. When the hare woke up, he saw the tortoise near the finish line.
            
            The hare ran as fast as he could, but it was too late. The tortoise crossed the finish line first and won the race.
            
            The hare learned that slow and steady wins the race. He was not proud anymore. The tortoise showed that determination and patience are more important than speed.`,
            my: `လှပသော တောအုပ်တစ်ခုမှာ ယုန်တစ်ကောင်နဲ့ လိပ်တစ်ကောင် နေထိုင်တယ်။ ယုန်က အရမ်းမြန်ပြီး ဂုဏ်ကြီးတယ်။ လိပ်က နှေးလွန်းလို့ သူမကို မကြာခဏ လှောင်ပြောင်လေ့ရှိတယ်။
            
            တစ်နေ့မှာ ယုန်က "မင်းက သိပ်နှေးတယ် လိပ်ရယ်။ မင်း ငါ့ကို ပြိုင်ပွဲမှာ ဘယ်တော့မှ အနိုင်မရနိုင်ဘူး" လို့ပြောတယ်။ လိပ်က အေးဆေးပြီး "ပြိုင်ပွဲတစ်ပွဲလုပ်ပြီး ကြည့်ရအောင်" လို့ ပြန်ဖြေတယ်။
            
            ယုန်က ရယ်ပြီး သဘောတူညီလိုက်တယ်။ တောအုပ်ထဲက တိရစ္ဆာန်အားလုံးက ပြိုင်ပွဲကြည့်ဖို့ လာကြတယ်။ ဘယ်သူအနိုင်ရမလဲဆိုတာ သူတို့ စိတ်လှုပ်ရှားနေကြတယ်။
            
            ပြိုင်ပွဲစတယ်။ ယုန်က အရမ်းမြန်မြန်ပြေးပြီး မကြာခင် အဝေးကြီးကို ရောက်သွားတယ်။ သူဟာ နောက်ပြန်ကြည့်လိုက်တဲ့အခါ လိပ်က သူ့နောက်မှာ ဖြည်းညင်းစွာ ရွေ့လျားနေတာကို မြင်တယ်။ ယုန်က "ငါ့မှာ အချိန်အများကြီးရှိတယ်။ ငါ အိပ်ချင်တယ်" လို့ တွေးတယ်။

            ယုန်က တတ်နိုင်သမျှ အမြန်ပြေးပေမယ့် အချိန်နောက်ကျသွားပြီ။ လိပ်က ပန်းဆုံးမျဉ်းကို ပထမဆုံးဖြတ်ပြီး ပြိုင်ပွဲအနိုင်ရခဲ့တယ်။

            {
            id: 7,
            title: "The Boy Who Cried Wolf",
            en: `Once upon a time, there was a young shepherd boy who lived in a small village. He was bored every day watching the sheep on the hillside.
            
            One day, the boy decided to play a trick on the villagers. He ran down to the village shouting, "Wolf! Wolf! A wolf is attacking the sheep!"
            
            The villagers heard his cries and ran up the hill to help him. When they got there, there was no wolf. The boy laughed and said, "I was just joking!"
            
            The next day, the boy did the same thing again. He shouted, "Wolf! Wolf!" The villagers came running again, but there was no wolf. They were angry with the boy.
            
            The next day, a real wolf came to attack the sheep. The boy was terrified and shouted loudly, "Wolf! Wolf! Please help me!"
            
            The villagers heard him but thought he was joking again. They did not come to help. The wolf killed many sheep and ran away.
            
            The boy learned a painful lesson that day. He realized that if you lie too often, people will not believe you when you tell the truth.`,
            my: `ရှေးလွန်လေပြီးသောအခါက ရွာငယ်လေးတစ်ရွာမှာ သိုးထိန်းကောင်လေးတစ်ယောက် နေထိုင်တယ်။ သူဟာ တောင်စောင်းပေါ်မှာ သိုးတွေကို နေ့တိုင်း ကြည့်ရတာ ပျင်းနေတယ်။

            ရွာသားတွေက သူ့အော်သံကိုကြားပြီး ကူညီဖို့ တောင်ပေါ်ကို ပြေးတက်လာကြတယ်။ သူတို့ရောက်တဲ့အခါ ဝံပုလွေမရှိဘူး။ ကောင်လေးက ရယ်ပြီး "ငါ ရယ်စရာ လုပ်တာပါ" လို့ပြောတယ်။
            
            နောက်တစ်နေ့မှာ ကောင်လေးက အတူတူပဲ ထပ်လုပ်တယ်။ သူဟာ "ဝံပုလွေ! ဝံပုလွေ!" လို့ အော်တယ်။ ရွာသားတွေ ထပ်ပြေးလာကြပေမယ့် ဝံပုလွေ မရှိဘူး။ သူတို့က ကောင်လေးကို ဒေါသထွက်သွားတယ်။
            
            နောက်တစ်နေ့မှာ တကယ့်ဝံပုလွေက သိုးတွေကို တိုက်လာတယ်။ ကောင်လေးက ကြောက်လန့်သွားပြီး ကျယ်လောင်စွာ "ဝံပုလွေ! ဝံပုလွေ! ကျေးဇူးပြုပြီး ကူညီပါ!" လို့ အော်တယ်။

            {
            id: 8,
            title: "The Golden Goose",
            en: `A farmer and his wife lived in a small house with their three daughters. They were very poor and struggled to find enough food to eat.
            
            One day, the farmer found a strange goose near the river. The goose was beautiful and had golden feathers. The farmer took the goose home.
            
            To their surprise, the goose laid a golden egg every morning. The family was very happy and became rich. They sold the golden eggs and lived comfortably.
            
            But the farmer was greedy. He wanted to get all the golden eggs at once. He said, "The goose must have a lot of gold inside. Let's cut it open."
            
            His wife warned him, "Don't be foolish! If you kill the goose, we will lose all the eggs." But the farmer did not listen.
            
            The farmer killed the goose and cut it open. But there was no gold inside. The goose was just an ordinary goose.
            
            The farmer lost his golden goose and never got any more golden eggs. He learned that greed can destroy a good thing.`,
            my: `လယ်သမားတစ်ယောက်နဲ့ သူ့ဇနီးဟာ သူတို့ရဲ့သမီးသုံးယောက်နဲ့အတူ အိမ်ငယ်လေးတစ်လုံးမှာ နေထိုင်တယ်။ သူတို့ဟာ အရမ်းဆင်းရဲပြီး စားဖို့အစာ လုံလုံလောက်လောက် ရှာရခက်ခဲတယ်။
            
            တစ်နေ့မှာ လယ်သမားက မြစ်အနီးမှာ ထူးဆန်းတဲ့ငန်းတစ်ကောင်ကို တွေ့လိုက်တယ်။ ငန်းက လှပပြီး ရွှေရောင်အမွေးတွေ ရှိတယ်။ လယ်သမားက ငန်းကို အိမ်ကို ခေါ်သွားတယ်။
            
            သူတို့ အံ့အားသင့်စရာက ငန်းက မနက်တိုင်း ရွှေဥတစ်လုံး ဥတယ်။ မိသားစုက အရမ်းပျော်သွားပြီး ချမ်းသာလာတယ်။ သူတို့ဟာ ရွှေဥတွေကို ရောင်းပြီး သက်တောင့်သက်သာ နေထိုင်ရတယ်။
            
            ဒါပေမယ့် လယ်သမားက လောဘကြီးတယ်။ သူဟာ ရွှေဥအားလုံးကို တစ်ခါတည်း လိုချင်တယ်။ သူက "ငန်းထဲမှာ ရွှေအများကြီး ရှိရမယ်။ ဖြတ်ဖွင့်ကြည့်ရအောင်" လို့ပြောတယ်။
            
            သူ့ဇနီးက သတိပေးတယ်၊ "မမိုက်ပါနဲ့! ငန်းကိုသတ်ရင် ဥတွေအားလုံး ဆုံးရှုံးလိမ့်မယ်" လို့ပြောပေမယ့် လယ်သမားက နားမထောင်ဘူး။
            
            လယ်သမားက ငန်းကိုသတ်ပြီး ဖြတ်ဖွင့်လိုက်တယ်။ ဒါပေမယ့် အတွင်းမှာ ရွှေမရှိဘူး။ ငန်းက သာမန်ငန်းတစ်ကောင်ပဲ။
            
            လယ်သမားက သူ့ရွှေငန်းကို ဆုံးရှုံးလိုက်ပြီး နောက်ထပ် ရွှေဥတွေ ဘယ်တော့မှ မရတော့ဘူး။ လောဘက ကောင်းတာကို ဖျက်ဆီးနိုင်တယ်ဆိုတာ သူ သင်ယူခဲ့တယ်။`,

            {
            id: 9,
            title: "The Wind and the Sun",
            en: `One day, the Wind and the Sun were arguing about who was stronger. They saw a man walking along the road wearing a coat.
            
            The Wind said, "I am stronger than you. Watch me blow that man's coat off." The Wind blew hard, but the man held his coat tightly.
            
            The Wind blew even harder, but the man held his coat even tighter. The Wind gave up and said, "You try."
            
            The Sun shone gently on the man. The man started to feel warm. He loosened his coat a little. The Sun shone brighter and the man took off his coat completely.
            
            The Sun said to the Wind, "Gentle persuasion is stronger than force. Kindness and warmth are more powerful than anger and strength."
            
            The Wind learned that being gentle is often better than being forceful. The Sun showed that kindness can achieve what strength cannot.`,
            my: `တစ်နေ့မှာ လေနဲ့ နေတို့က ဘယ်သူက ပိုသန်မာလဲဆိုတာ ငြင်းခုံနေကြတယ်။ သူတို့ဟာ ကုတ်အင်္ကျီဝတ်ထားတဲ့ လူတစ်ယောက် လမ်းပေါ်မှာ လျှောက်လာတာကို မြင်လိုက်တယ်။

            {
            id: 10,
            title: "The Ant and the Grasshopper",
            en: `In a green meadow, there lived an ant and a grasshopper. The ant was very hardworking and saved food for the winter.
            
            The grasshopper was lazy and spent all his time singing and dancing. He laughed at the ant and said, "Why work so hard? Enjoy the summer!"
            
            The ant replied, "I am saving food for winter. You should do the same." But the grasshopper ignored the ant and continued playing.
            
            When winter came, it was very cold and snowy. The ant had plenty of food in his warm home. The grasshopper had nothing to eat and was freezing.
            
            The grasshopper went to the ant's house and begged for food. The ant said, "I worked hard while you played. Now you must learn your lesson."
            
            The ant gave him some food and let him stay for the night. The grasshopper realized that hard work is important. He decided to save food next year.`,
            my: `စိမ်းလန်းတဲ့ မြက်ခင်းပြင်တစ်ခုမှာ ပုရွက်ဆိတ်တစ်ကောင်နဲ့ ကျိုင်းကောင်တစ်ကောင် နေထိုင်တယ်။ ပုရွက်ဆိတ်က အရမ်းကြိုးစားပြီး ဆောင်းရာသီအတွက် အစာသိုလှောင်တယ်။
            
            ကျိုင်းကောင်က ပျင်းရိပြီး သူ့အချိန်အားလုံးကို သီချင်းဆိုပြီး ကခုန်နေတယ်။ သူဟာ ပုရွက်ဆိတ်ကို ပြက်ရယ်ပြုပြီး "ဘာလို့ အရမ်းကြိုးစားနေတာလဲ။ နွေရာသီကို ပျော်ပျော်နေပါ" လို့ပြောတယ်။
            
            ပုရွက်ဆိတ်က "ငါ ဆောင်းအတွက် အစာသိုလှောင်တယ်။ မင်းလည်း အဲဒီလိုလုပ်သင့်တယ်" လို့ပြန်ပြောတယ်။ ဒါပေမယ့် ကျိုင်းကောင်က ပုရွက်ဆိတ်ကို လျစ်လျူရှုပြီး ဆက်ကစားနေတယ်။
            
            ဆောင်းရာသီရောက်တဲ့အခါ အရမ်းအေးပြီး နှင်းတွေကျတယ်။ ပုရွက်ဆိတ်မှာ သူ့အိမ်နွေးနွေးလေးထဲမှာ အစာအများကြီးရှိတယ်။ ကျိုင်းကောင်မှာ စားစရာဘာမှမရှိဘဲ ခဲနေတယ်။
            
            ကျိုင်းကောင်က ပုရွက်ဆိတ်အိမ်ကိုသွားပြီး အစာတောင်းတယ်။ ပုရွက်ဆိတ်က "မင်းကစားနေတုန်း ငါကြိုးစားအလုပ်လုပ်တယ်။ အခု မင်း သင်ခန်းစာယူရမယ်" လို့ပြောတယ်။

            {
            id: 11,
            title: "The Lion and the Mouse",
            en: `A mighty lion was sleeping in the forest. A tiny mouse ran over his body and woke him up. The lion was angry and caught the mouse.
            
            The mouse begged, "Please let me go! I will repay you one day." The lion laughed and said, "How can a tiny mouse help a mighty lion?" But he let the mouse go.
            
            A few days later, the lion was caught in a hunter's net. He roared loudly, but no one came. The mouse heard the lion's roar and ran to help.
            
            The mouse chewed the ropes with his sharp teeth and freed the lion. The lion said, "I was wrong. Even a tiny mouse can help a mighty lion."
            
            They became best friends and lived happily ever after.`,
            my: `သန်မာတဲ့ ခြင်္သေ့တစ်ကောင်ဟာ တောအုပ်ထဲမှာ အိပ်နေတယ်။ ကြွက်ငယ်လေးတစ်ကောင်က သူ့ကိုယ်ပေါ်ကို ဖြတ်ပြေးပြီး နိုးလာစေတယ်။ ခြင်္သေ့က ဒေါသထွက်ပြီး ကြွက်ကိုဖမ်းလိုက်တယ်။
            
            ကြွက်က "ကျေးဇူးပြုပြီး လွှတ်ပေးပါ။ တစ်နေ့ကျရင် ပြန်ဆပ်ပါမယ်" လို့ တောင်းပန်တယ်။ ခြင်္သေ့က ရယ်ပြီး "ကြွက်ငယ်လေးက ခြင်္သေ့ကြီးကို ဘယ်လိုကူညီနိုင်မလဲ" လို့ပြောပေမယ့် လွှတ်လိုက်တယ်။
            
            ရက်အနည်းငယ်ကြာတော့ ခြင်္သေ့က မုဆိုးရဲ့ပိုက်ထဲမှာ ဖမ်းမိတယ်။ သူဟာ ကျယ်လောင်စွာ ဟိန်းဟိန်းအော်ပေမယ့် ဘယ်သူမှ မလာဘူး။ ကြွက်က ခြင်္သေ့ရဲ့အော်သံကိုကြားပြီး ကူညီဖို့ ပြေးလာတယ်။
            
            ကြွက်က သူ့သွားချွန်တွေနဲ့ ကြိုးတွေကို ကိုက်ဖြတ်ပြီး ခြင်္သေ့ကို လွတ်အောင်လုပ်တယ်။ ခြင်္သေ့က "ငါမှားသွားတယ်။ ကြွက်ငယ်လေးတောင်မှ ခြင်္သေ့ကြီးကို ကူညီနိုင်တယ်" လို့ပြောတယ်။

            id: 12,
            title: "The Peacock and the Crane",
            en: `A proud peacock was showing off his beautiful feathers to a crane. He said, "Look at my colorful feathers! You are so plain and boring."
            
            The crane replied calmly, "It is true that your feathers are more beautiful than mine. But I can fly high in the sky. You cannot fly at all."

            my: `ဂုဏ်ကြီးတဲ့ ဒေါင်းတစ်ကောင်ဟာ ကြိုးကြာတစ်ကောင်ကို သူ့ရဲ့လှပတဲ့အမွေးတွေကို ပြသပြီး "ငါ့ရဲ့ရောင်စုံအမွေးတွေကို ကြည့်ပါ။ မင်းက သိပ်ပျင်းစရာကောင်းပြီး သာမန်ပဲ" လို့ပြောတယ်။
            
            ကြိုးကြာက အေးဆေးစွာ "မင်းရဲ့အမွေးတွေက ငါ့ထက် ပိုလှတာ အမှန်ပါ။ ဒါပေမယ့် ငါ ကောင်းကင်မှာ မြင့်မြင့်ပျံနိုင်တယ်။ မင်းက လုံးဝမပျံနိုင်ဘူး" လို့ပြန်ဖြေတယ်။
            
            ဒေါင်းက ရှက်သွားတယ်။ အလှတရားက အရာအားလုံးမဟုတ်ဘူးဆိုတာ သူ နားလည်သွားတယ်။ ကြိုးကြာက "ငါတို့တစ်ယောက်မှာ ကိုယ့်အားသာချက်တွေရှိတယ်။ မင်းမှာ အလှရှိတယ်၊ ငါ့မှာ လွတ်လပ်မှုရှိတယ်" လို့ပြောတယ်။

            id: 13,
            title: "The Dog and the Shadow",
            en: `A greedy dog stole a large piece of meat from a shop. He ran to a bridge to eat his meat alone.

            my: `လောဘကြီးတဲ့ခွေးတစ်ကောင်ဟာ ဆိုင်တစ်ဆိုင်ကနေ အသားကြီးတစ်တုံးကို ခိုးယူတယ်။ သူဟာ တစ်ယောက်တည်း အသားစားဖို့ တံတားဆီကို ပြေးသွားတယ်။

            {
            id: 14,
            title: "The Bear and the Two Travelers",
            en: `Two friends were traveling together through a dangerous forest. They promised to always help each other.
            
            Suddenly, a big bear appeared on the path. One friend quickly climbed a tree and hid. The other friend could not climb the tree.
            
            The second friend lay on the ground and pretended to be dead. The bear came near him and sniffed his body. The bear thought he was dead and walked away.
            
            When the bear was gone, the first friend came down from the tree. He asked, "What did the bear whisper in your ear?"
            
            The second friend replied, "The bear said, 'Never trust a friend who abandons you in danger.'" The first friend felt ashamed.
            
            They learned that a true friend stays with you in difficult times.`,
            my: `မိတ်ဆွေနှစ်ယောက်ဟာ အန္တရာယ်များတဲ့ တောအုပ်ထဲမှာ အတူခရီးသွားနေတယ်။ သူတို့ဟာ အချင်းချင်း အမြဲကူညီဖို့ ကတိပေးထားတယ်။
            
            ရုတ်တရက် ဝက်ဝံကြီးတစ်ကောင်က လမ်းပေါ်မှာ ပေါ်လာတယ်။ မိတ်ဆွေတစ်ယောက်က သစ်ပင်ပေါ်ကို လျင်မြန်စွာ တက်ပြီး ပုန်းလိုက်တယ်။ အခြားမိတ်ဆွေက သစ်ပင်မတက်နိုင်ဘူး။
            
            ဒုတိယမိတ်ဆွေက မြေပေါ်မှာ အိပ်ပြီး သေဆောင်ခဲ့တယ်။ ဝက်ဝံက သူ့အနားကိုလာပြီး ခန္ဓာကိုယ်ကို နမ်းကြည့်တယ်။ ဝက်ဝံက သူသေပြီလို့ထင်ပြီး ထွက်သွားတယ်။

            {
            id: 15,
            title: "The Oak and the Reed",
            en: `A tall oak tree grew proudly by the river. Beside it, a small reed swayed gently in the wind.
            
            The oak said, "I am so strong and big. The wind cannot bend me. You are so weak and bend with every breeze."
            
            The reed replied, "I am flexible. I bend so that I do not break." The oak laughed and said, "I will never break."
            
            A great storm came with strong winds. The oak stood firm, but the wind was too strong. The oak cracked and fell into the river.
            
            The reed bent low and survived the storm. The reed said to the fallen oak, "It is better to be flexible than to be rigid and break."
            
            The oak learned that being flexible is better than being too rigid.`,
            my: `မြစ်အနီးမှာ အရပ်ရှည်တဲ့ သစ်ပင်ကြီးတစ်ပင် ဂုဏ်ယူစွာ ပေါက်နေတယ်။ ဘေးမှာ ကျူပင်ငယ်လေးတစ်ပင် လေထဲမှာ ညင်သာစွာ လွင့်နေတယ်။

            title: "The Goose and the Golden Eggs",
            en: `A poor farmer had a goose that laid one golden egg every day. The farmer was happy because he could sell the eggs and earn money.

            {
            id: 17,
            title: "The Camel and the Tent",
            en: `A traveler set up his tent in the middle of a cold desert. He brought his camel along and tied it outside.
            
            At night, the wind became very cold. The camel asked, "Master, please let me put my nose inside the tent. It is very cold outside."
            
            The traveler agreed. The camel put his nose inside. Soon the camel asked, "My neck is cold. Please let me put my neck inside."
            
            The traveler agreed again. The camel put his neck inside. Then the camel asked for his shoulders and his body.
            
            Finally, the camel pushed the traveler out of the tent and took the whole tent for himself.
            
            The traveler learned that if you give a little, some people will want everything. He should have set boundaries.`,
            my: `ခရီးသွားတစ်ယောက်ဟာ အေးလွန်းတဲ့ကန္တာရအလယ်မှာ သူ့တဲကို ထောင်တယ်။ သူဟာ သူ့ကုလားအုတ်ကို ခေါ်လာပြီး အပြင်မှာ ချည်ထားတယ်။
            
            ညဘက်မှာ လေက အရမ်းအေးလာတယ်။ ကုလားအုတ်က "သခင်ရယ်၊ ကျေးဇူးပြုပြီး ကျွန်တော့်နှာခေါင်းကို တဲထဲထည့်ပေးပါ။ အပြင်က အရမ်းအေးလို့ပါ" လို့တောင်းတယ်။
            
            ခရီးသွားက သဘောတူလိုက်တယ်။ ကုလားအုတ်က နှာခေါင်းကိုထည့်တယ်။ မကြာခင်မှာ ကုလားအုတ်က "ကျွန်တော့်လည်ပင်းက အေးနေတယ်။ လည်ပင်းကိုထည့်ခွင့်ပြုပါ" လို့တောင်းတယ်။

            {
            id: 18,
            title: "The Crow and the Pitcher",
            en: `On a hot summer day, a thirsty crow searched everywhere for water. He finally saw a pitcher with a little water at the bottom.
            
            The crow tried to drink but his beak could not reach the water. He was very sad. He thought for a long time.
            
            Then, the crow had a clever idea. He picked up small stones and dropped them into the pitcher one by one.
            
            With each stone, the water level rose higher. The crow kept working hard until the water reached the top.
            
            The crow drank the water happily and flew away. He learned that thinking can solve problems.`,
            my: `နွေရာသီ ပူပြင်းတဲ့နေ့မှာ ရေငတ်နေတဲ့ကျီးကန်းတစ်ကောင်ဟာ ရေအတွက် နေရာတိုင်း ရှာဖွေတယ်။ နောက်ဆုံးမှာ အိုးတစ်လုံးရဲ့အောက်ခြေမှာ ရေအနည်းငယ်ရှိတာကို မြင်လိုက်တယ်။
            
            ကျီးကန်းက သောက်ဖို့ကြိုးစားပေမယ့် သူ့နှုတ်သီးက ရေကို မရောက်နိုင်ဘူး။ သူဟာ အရမ်းဝမ်းနည်းသွားတယ်။ သူဟာ ကြာကြာ စဉ်းစားတယ်။

            id: 19,
            title: "The Boy and the Nuts",
            en: `A little boy was given a jar of nuts. He loved nuts very much. He put his hand into the jar and grabbed as many nuts as he could.

            The boy let go of some nuts and pulled his hand out. He learned that if you are greedy, you may lose everything.`,
            my: `ကောင်လေးငယ်တစ်ယောက်ကို သစ်ကြားသီးအိုးတစ်လုံး ပေးထားတယ်။ သူဟာ သစ်ကြားသီးကို အရမ်းကြိုက်တယ်။ သူဟာ လက်ကို အိုးထဲထည့်ပြီး တတ်နိုင်သမျှ သစ်ကြားသီးများများ ဆုပ်ကိုင်လိုက်တယ်။

            {
            id: 20,
            title: "The Donkey in the Lion's Skin",
            en: `A donkey found a lion's skin in the forest. He put it on and thought he looked very fierce.
            
            The donkey walked through the forest wearing the lion's skin. All the animals ran away from him because they thought he was a real lion.
            
            The donkey felt very proud and powerful. He started braying loudly to show off. His braying sounded like a donkey.

            The donkey learned that you cannot hide your true nature for long. Pretending to be something you are not is foolish.`,
            my: `မြည်းတစ်ကောင်ဟာ တောအုပ်ထဲမှာ ခြင်္သေ့အရေခွံတစ်ခုကို တွေ့တယ်။ သူဟာ အဲဒါကိုဝတ်ပြီး သူဟာ အရမ်းရက်စက်ပုံရတယ်လို့ ထင်တယ်။

            {
            id: 21,
            title: "The Traveler and the Tree",
            en: `A traveler was walking on a hot summer day. He felt very tired and thirsty. He saw a big tree with wide branches.
            
            The traveler sat under the tree to rest. He said, "This tree is wonderful. It gives so much shade."
            
            Then he looked up and saw the tree had no fruits. He said, "What a useless tree! It gives no fruits."
            
            The tree replied, "I give shade to tired travelers like you. That is my gift."
            
            The traveler felt ashamed and thanked the tree. He learned that not everything has to give fruits to be useful.`,
            my: `ခရီးသွားတစ်ယောက်ဟာ နွေရာသီ ပူပြင်းတဲ့နေ့မှာ လမ်းလျှောက်နေတယ်။ သူဟာ အရမ်းပင်ပန်းပြီး ရေငတ်နေတယ်။ အကိုင်းအခက်ကျယ်တဲ့ သစ်ပင်ကြီးတစ်ပင် မြင်လိုက်တယ်။
            
            ခရီးသွားက အနားယူဖို့ သစ်ပင်အောက်မှာ ထိုင်တယ်။ သူက "ဒီသစ်ပင်က အံ့သြစရာကောင်းတယ်။ အရိပ်အများကြီးပေးတယ်" လို့ပြောတယ်။
            
            ပြီးတော့ အပေါ်ကိုကြည့်လိုက်တဲ့အခါ သစ်ပင်မှာ အသီးမရှိတာကို မြင်တယ်။ သူက "အသုံးမဝင်တဲ့သစ်ပင်! အသီးမပေးဘူး" လို့ပြောတယ်။

            {
            id: 22,
            title: "The Two Pots",
            en: `There were two pots in the river. One was made of iron and the other was made of clay.
            
            The iron pot said to the clay pot, "Let us travel together downstream." The clay pot replied, "I am afraid. If we bump together, I will break."
            
            The iron pot said, "Do not worry. I will protect you." The clay pot agreed and they floated together.
            
            But the river was rough and the pots bumped each other. The clay pot broke into many pieces.
            
            The iron pot felt sad. He learned that strong and weak should not travel together.`,
            my: `မြစ်ထဲမှာ အိုးနှစ်လုံးရှိတယ်။ တစ်လုံးက သံအိုး၊ နောက်တစ်လုံးက မြေအိုးဖြစ်တယ်။
            
            သံအိုးက မြေအိုးကို "မြစ်အောက်ကို အတူခရီးသွားကြရအောင်" လို့ပြောတယ်။ မြေအိုးက "ငါကြောက်တယ်။ ငါတို့တိုက်မိရင် ငါကျိုးမယ်" လို့ပြန်ဖြေတယ်။
            
            သံအိုးက "မပူပါနဲ့။ ငါမင်းကို ကာကွယ်မယ်" လို့ပြောတယ်။ မြေအိုးက သဘောတူပြီး သူတို့ အတူမျောလာကြတယ်။

            {
            id: 23,
            title: "The Old Man and His Sons",
            en: `An old man had many sons who always fought with each other. He was very sad because they could not get along.
            
            One day, the old man gave them a bundle of sticks. He said, "Try to break this bundle." Each son tried but none could break it.
            
            Then the old man untied the bundle and gave each son one stick. "Now break your stick," he said. Each son easily broke his stick.
            
            The old man said, "Together you are strong. Apart you are weak. If you stay united, no one can hurt you."
            
            The sons understood and stopped fighting. They learned that unity is strength.`,
            my: `အဖိုးအိုတစ်ယောက်မှာ အချင်းချင်း အမြဲရန်ဖြစ်နေတဲ့ သားအများကြီးရှိတယ်။ သူတို့ အတူတကွ မနေနိုင်လို့ သူဟာ အရမ်းဝမ်းနည်းတယ်။
            
            တစ်နေ့မှာ အဖိုးအိုက သူတို့ကို တုတ်တစ်စည်းပေးတယ်။ သူက "ဒီတုတ်စည်းကို ချိုးကြည့်ကြ" လို့ပြောတယ်။ သားတိုင်း ကြိုးစားပေမယ့် ဘယ်သူမှ မချိုးနိုင်ဘူး။
            
            ပြီးတော့ အဖိုးအိုက တုတ်စည်းကို ဖြေပြီး သားတစ်ယောက်ကို တုတ်တစ်ချောင်းစီပေးတယ်။ "အခု မင်းတို့ရဲ့တုတ်ကို ချိုးကြည့်" လို့ပြောတယ်။ သားတိုင်း သူ့တုတ်ကို အလွယ်တကူ ချိုးနိုင်တယ်။

            {
            id: 24,
            title: "The Bird and the Worm",
            en: `A hungry bird was searching for food. He saw a worm coming out of the ground. The bird caught the worm.
            
            The worm pleaded, "Please let me go. I have a family to feed." The bird said, "I am hungry too. I must eat."
            
            The worm said, "If you let me go, I will tell you where to find many worms." The bird thought and let the worm go.
            
            The worm told the bird about a place with many worms. The bird flew there and found many worms.
            
            The bird was happy and ate his fill. He learned that sometimes it is better to be kind than to be selfish.`,
            my: `ဆာနေတဲ့ငှက်တစ်ကောင်ဟာ အစာရှာနေတယ်။ သူဟာ မြေကြီးထဲကနေ သန်ကောင်တစ်ကောင် ထွက်လာတာကို မြင်တယ်။ ငှက်က သန်ကောင်ကို ဖမ်းလိုက်တယ်။
            
            သန်ကောင်က "ကျေးဇူးပြုပြီး လွှတ်ပေးပါ။ ကျွန်တော့်မှာ ကျွေးမွေးရမယ့် မိသားစုရှိတယ်" လို့တောင်းပန်တယ်။ ငှက်က "ငါလည်း ဆာနေတယ်။ ငါစားရမယ်" လို့ပြောတယ်။
            
            သန်ကောင်က "လွှတ်ပေးရင် သန်ကောင်အများကြီးရှိတဲ့နေရာကို ပြောပြမယ်" လို့ပြောတယ်။ ငှက်က စဉ်းစားပြီး သန်ကောင်ကို လွှတ်လိုက်တယ်။

            id: 25,
            title: "The Eagle and the Beetle",
            en: `An eagle was chasing a beetle. The beetle was very small and the eagle was very big.

            my: `လင်းယုန်တစ်ကောင်ဟာ ပိုးတောင်မာတစ်ကောင်ကို လိုက်ဖမ်းနေတယ်။ ပိုးတောင်မာက အရမ်းသေးငယ်ပြီး လင်းယုန်က အရမ်းကြီးတယ်။
            
            ပိုးတောင်မာက "ကျွန်တော့်အသက်ကို ကယ်ပေးပါ။ စားဖို့ သိပ်သေးလွန်းပါတယ်" လို့တောင်းပန်တယ်။ ဒါပေမယ့် လင်းယုန်က ရယ်ပြီး ဆက်လိုက်တယ်။
            
            ပိုးတောင်မာက "ငါ့ကိုစားရင် ငါပြန်လက်စားချေမယ်" လို့ပြောတယ်။ လင်းယုန်က ပိုပြီးကျယ်လောင်စွာ ရယ်တယ်။

            id: 26,
            title: "The Fox Without a Tail",
            en: `A fox was caught in a trap. He escaped but lost his tail. He felt very ashamed and thought all the other foxes would laugh at him.

            my: `မြေခွေးတစ်ကောင်ဟာ ထောင်ချောက်ထဲမှာ ဖမ်းမိတယ်။ သူဟာ လွတ်သွားပေမယ့် အမြီးဆုံးရှုံးသွားတယ်။ သူဟာ အရမ်းရှက်ပြီး အခြားမြေခွေးတွေ သူ့ကိုရယ်မယ်လို့ ထင်တယ်။

            {
            id: 27,
            title: "The Frog and the Ox",
            en: `A frog saw a big ox in the field. The frog was very small and the ox was very large.
            
            The frog wanted to be as big as the ox. He puffed himself up and asked, "Am I as big as the ox now?" His friends said, "No."
            
            The frog puffed himself up even more and asked again. His friends said, "No, you are still small."
            
            The frog tried once more and puffed himself up so much that he burst.
            
            The other frogs learned that you should not try to be what you are not. Be happy with who you are.`,
            my: `ဖားတစ်ကောင်ဟာ လယ်ကွင်းထဲမှာ နွားကြီးတစ်ကောင်ကို မြင်တယ်။ ဖားက အရမ်းသေးငယ်ပြီး နွားက အရမ်းကြီးတယ်။
            
            ဖားက နွားလောက်ကြီးချင်တယ်။ သူဟာ ကိုယ့်ကိုယ်ကို ဖောင်းကြွအောင်လုပ်ပြီး "ငါ အခု နွားလောက်ကြီးပြီလား" လို့မေးတယ်။ သူ့သူငယ်ချင်းတွေက "မဟုတ်ဘူး" လို့ပြောတယ်။

            {
            id: 28,
            title: "The Swallow and the Crow",
            en: `A swallow and a crow were arguing about who was more beautiful. The swallow said, "I am beautiful because I have colorful feathers."
            
            The crow replied, "You are beautiful in spring and summer. But I am beautiful all year round. My black feathers are always elegant."
            
            The swallow laughed and said, "But you are so dark and dull." The crow said, "Darkness has its own beauty."
            
            A wise owl heard them and said, "Beauty is in the eye of the beholder. You are both beautiful in your own ways."
            
            The birds understood and stopped arguing. They learned that beauty is not just one thing.`,

        // =============================================================
        //  Spinner ထဲကို Option တွေထည့်မယ်
        // =============================================================
        const selectEl = document.getElementById('storySelect');
        const displayEl = document.getElementById('storyDisplay');

        stories.forEach((story, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.textContent = `${story.id}. ${story.title}`;
            selectEl.appendChild(option);
        });

        // --------------------------------------------------------------
        //  Function: Story ပြောင်းပြမယ်
        // --------------------------------------------------------------
        function showStory(index) {
            const story = stories[index];
            if (!story) return;

            // Vocabulary
            let vocabHtml = '';
            story.vocab.forEach(v => {
                vocabHtml += 
                    `<span class="vocab-tag">${v.word} <span class="meaning">- ${v.meaning}</span></span>`;
            });

            displayEl.innerHTML = `
                <div class="title">${story.id}. ${story.title}</div>
                <div class="story-en">
                    <span class="label">📖 English</span>
                    ${story.en}
                </div>
                <hr class="divider">
                <div class="story-my">
                    <span class="label">🇲🇲 မြန်မာပြန်</span>
                    ${story.my}
                </div>
                <div class="vocab-section">
                    <div class="vocab-title">📝 Key Vocabulary (အဓိပ္ပါယ် ၅၀)</div>
                    <div class="vocab-list">${vocabHtml}</div>
                </div>
            `;
        }

        // --------------------------------------------------------------
        //  Spinner ပြောင်းတိုင်း story ပြောင်းမယ်
        // --------------------------------------------------------------
        selectEl.addEventListener('change', function() {
            const index = parseInt(this.value);
            showStory(index);
        });
