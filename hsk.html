  <style>
    /* ===== Reset ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ===== Dark Base ===== */
    body {
      background: #0d1117;
      font-family: "Pyidaungsu", "Noto Sans Myanmar", "Segoe UI", sans-serif;
      color: #e6edf3;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    /* ===== Wrapper ===== */
    .table-wrapper {
      width: 100%;
      max-width: 900px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    /* ===== Top Bar (Title + Spinner) ===== */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 2px solid #21262d;
    }

    .table-title {
      font-size: 22px;
      font-weight: 700;
      color: #58a6ff;
      letter-spacing: 0.5px;
    }

    /* ===== Spinner (Dropdown) ===== */
    .day-spinner {
      appearance: none;
      -webkit-appearance: none;
      background-color: #1c2128;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2358a6ff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      color: #e6edf3;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 40px 10px 16px;
      border: 1px solid #30363d;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      min-width: 160px;
    }

    .day-spinner:hover {
      border-color: #1f6feb;
      background-color: #21262d;
    }

    .day-spinner:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.35);
    }

    .day-spinner option {
      background: #161b22;
      color: #e6edf3;
      padding: 8px;
    }

    /* ===== Table ===== */
    .vocab-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 12px;
      overflow: hidden;
    }

    .vocab-table thead th {
      background: linear-gradient(135deg, #1f6feb, #388bfd);
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      padding: 14px 16px;
      letter-spacing: 0.3px;
    }

    .vocab-table tbody td {
      padding: 12px 16px;
      font-size: 15px;
      border-bottom: 1px solid #21262d;
      color: #c9d1d9;
      transition: background 0.2s ease;
    }

    .vocab-table tbody tr:nth-child(even) { background: #1c2128; }
    .vocab-table tbody tr:hover { background: #21262d; }
    .vocab-table tbody tr:hover td { color: #ffffff; }
    .vocab-table tbody tr:last-child td { border-bottom: none; }

    /* Column styles */
    .hanzi { font-size: 20px; font-weight: 600; color: #79c0ff; }
    .pinyin { color: #d2a8ff; font-style: italic; font-weight: 500; }
    .vocab-table tbody td:first-child { color: #8b949e; font-weight: 600; width: 60px; }

    /* ===== Fade Animation ===== */
    .fade-in { animation: fadeIn 0.35s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ===== Responsive ===== */
    @media (max-width: 600px) {
      .table-wrapper { padding: 16px; border-radius: 12px; }
      .table-title { font-size: 18px; }
      .day-spinner { font-size: 14px; padding: 9px 36px 9px 14px; min-width: 130px; }
      .vocab-table thead th,
      .vocab-table tbody td { padding: 10px 8px; font-size: 13px; }
      .hanzi { font-size: 17px; }
    }
  </style>
</head>

    /* ===== Render Function ===== */
    function renderDay(day) {
      const d = data[day];
      if (!d) return;

      titleEl.textContent = d.title;

      bodyEl.innerHTML = d.rows.map((row, i) => `
        <tr>
          <td>${i + 1}</td>
          <td class="hanzi">${row[0]}</td>
          <td class="pinyin">${row[1]}</td>
          <td>${row[2]}</td>
        </tr>
      `).join("");

      /* Fade animation */
      bodyEl.classList.remove("fade-in");
      void bodyEl.offsetWidth; // reflow
      bodyEl.classList.add("fade-in");
    }
