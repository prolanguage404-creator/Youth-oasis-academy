    // ----- helper: render dialog lines -----
    function renderDialog(lines) {
      return lines.map(line => `
        <div class="dialog-line">
          <span class="cn">${line.cn}</span>
          <span class="pinyin">${line.pinyin}</span>
          <span class="my">${line.my}</span>
        </div>
      `).join('');
    }

    // ----- render grammar examples -----
    function renderExamples(examples) {
      return examples.map(ex => `
        <li>
          <span class="ex-cn">${ex.cn}</span>
          <span class="ex-pinyin">${ex.pinyin}</span>
          <span class="ex-my">${ex.my}</span>
        </li>
      `).join('');
    }

    // ----- render exercise options -----
    function renderOptions(options, name) {
      return options.map((opt, idx) => `
        <label>
          <input type="radio" name="${name}" value="${idx}">
          <span class="opt-cn">${opt.cn}</span>
          <span class="opt-pinyin">${opt.pinyin}</span>
          <span class="opt-my">${opt.my}</span>
        </label>
      `).join('');
    }

    // ----- main render -----
    function renderLesson(lessonKey) {
      const data = lessons[lessonKey];
      if (!data) { displayDiv.innerHTML = '<p>သင်ခန်းစာ မတွေ့ပါ။</p>'; return; }

      let html = `<div class="lesson-title">${data.title}</div>`;

      // dialog
      html += `<div class="subhead">💬 Dialog</div>`;
      html += `<div class="dialog-box">${renderDialog(data.dialogLines)}</div>`;

      // vocab
      html += `<div class="subhead">📖 ဝေါဟာရ (၃၀)</div><div class="grid-2col">`;
      data.vocab.forEach(v => {
        html += `<div class="vocab-item">
          <span><span class="vocab-chinese">${v.cn}</span> <span class="vocab-pinyin">${v.pinyin}</span></span>
          <span class="vocab-meaning">${v.meaning}</span>
        </div>`;
      });
      html += `</div>`;

      // grammar
      html += `<div class="subhead">🧩 Grammar (၈ ခု · Pattern)</div>`;
      data.grammar.forEach(g => {
        html += `<div class="grammar-block">
          <div class="grammar-pattern">📐 ${g.pattern}</div>
          <div class="grammar-desc">📌 ${g.desc}</div>
          <ul class="example-list">${renderExamples(g.examples)}</ul>
        </div>`;
      });

      // exercises
      html += `<div class="subhead">✍️ လေ့ကျင့်ခန်း (၈ ခု)</div>`;
      html += `<div class="exercise-section" id="exerciseSection">`;
      data.exercises.forEach((ex, idx) => {
        const qId = `ex${idx}_${lessonKey}`;
        html += `<div class="exercise-item" id="${qId}Block">`;
        html += `<div class="exercise-question">
          <span class="q-cn">${ex.question.cn}</span>
          <span class="q-pinyin">${ex.question.pinyin}</span>
          <span class="q-my">${ex.question.my}</span>
        </div>`;
        html += `<div class="exercise-options">${renderOptions(ex.options, qId)}</div>`;
        html += `<button class="check-btn" data-exercise="${qId}" data-answer="${ex.answer}">စစ်ဆေးမည်</button>`;
        html += `<div class="feedback" id="${qId}Feedback"></div>`;
        html += `</div>`;
      });
      html += `</div>`;

      displayDiv.innerHTML = html;

      // attach events
      document.querySelectorAll('.check-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          const exId = this.dataset.exercise;
          const correct = parseInt(this.dataset.answer);
          const block = document.getElementById(exId+'Block');
          const radios = block.querySelectorAll('input[type="radio"]');
          let selected = null;
          for (let r of radios) { if (r.checked) { selected = parseInt(r.value); break; } }
          const feedback = document.getElementById(exId+'Feedback');
          if (selected === null) {
            feedback.className = 'feedback';
            feedback.textContent = '⚠️ ကျေးဇူးပြု၍ အဖြေတစ်ခုရွေးပါ။';
            return;
          }
          if (selected === correct) {
            feedback.className = 'feedback correct';
            feedback.textContent = '✅ မှန်ပါသည်။ ကောင်းပါတယ်။';
          } else {
            const labels = block.querySelectorAll('.exercise-options label');
            const correctText = labels[correct]?.textContent?.trim() || 'မသိရ';
            feedback.className = 'feedback wrong';
            feedback.textContent = `❌ မှားပါသည်။ အဖြေမှန်က “${correctText}” ဖြစ်ပါတယ်။`;
          }
        });
      });
    }

    // ----- init -----
    const lessonSelect = document.getElementById('lessonSelect');
    const displayDiv = document.getElementById('lessonDisplay');

    function populateSpinner() {
      lessonSelect.innerHTML = '';
      for (let key in lessons) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = `Lesson ${key} · ${lessons[key].title.replace('Lesson '+key+' · ','')}`;
        lessonSelect.appendChild(opt);
      }
    }
    populateSpinner();
    renderLesson('1');
    lessonSelect.addEventListener('change', function() { renderLesson(this.value); });

  })();
</script>
</body>
</html>
