    { hanzi: "祝你们幸福！ (Zhù nǐmen xìngfú!)", pinyin: "Zhù nǐmen xìngfú!", meaning: "မင်းတို့ ပျော်ရွှင်ပါစေ။" },
    { hanzi: "祝你生日快乐！ (Zhù nǐ shēngrì kuàilè!)", pinyin: "Zhù nǐ shēngrì kuàilè!", meaning: "မင်း မွေးနေ့ပျော်ရွှင်ပါစေ။" },

    { hanzi: "一起学习。 (Yīqǐ xuéxí.)", pinyin: "Yīqǐ xuéxí.", meaning: "အတူစာသင်ကြမယ်။" },
    { hanzi: "一起吃饭。 (Yīqǐ chīfàn.)", pinyin: "Yīqǐ chīfàn.", meaning: "အတူထမင်းစားကြမယ်။" },

    ],
    exercises: [
    { question: "小李对未来有什么计划？", answer: "去中国留学" },

    { question: "小李希望未来怎么样？", answer: "希望如此" },

    // ============================================================
    // RENDER & CONTROL
    // ============================================================
    const lessonSelect = document.getElementById('lessonSelect');
    const container = document.getElementById('lessonContainer');

    const lessons = {
      1: lesson1,
      2: lesson2,
      3: lesson3,
      4: lesson4,
      5: lesson5,
      6: lesson6,
      7: lesson7,
      8: lesson8,
      9: lesson9,
      10: lesson10,
      11: lesson11,
      12: lesson12,
      13: lesson13,
      14: lesson14,
      15: lesson15,
      16: lesson16,
      17: lesson17,
      18: lesson18,
      19: lesson19,
      20: lesson20
    };

    function renderLesson(lesson) {
      if (!lesson || !lesson.dialog || lesson.dialog.length === 0) {
        container.innerHTML = `<div class="card"><p style="padding:40px;text-align:center;font-size:1.2rem;">📝 သင်ခန်းစာ ${lesson.lessonNumber} အတွက် အကြောင်းအရာ မရှိသေးပါ။ ဆက်လက်ဖြည့်စွက်ပါ။</p></div>`;
        return;
      }

      let html = `<div class="card">`;
      html += `<div class="lesson-title"><span>📚 Lesson ${lesson.lessonNumber}</span> <span class="badge">${lesson.title}</span></div>`;

      // Dialog
      html += `<div class="section-title">🗣️ Dialog</div>`;
      html += `<div class="dialog-box">`;
      lesson.dialog.forEach(line => {
        html += `<p><span class="hanzi">${line.hanzi}</span> <span class="pinyin">${line.pinyin}</span> <span class="meaning">${line.meaning}</span></p>`;
      });
      html += `</div>`;

      // Vocabulary
      if (lesson.vocab && lesson.vocab.length > 0) {
        html += `<div class="section-title">📖 အဓိပ္ပါယ် ${lesson.vocab.length} လုံး</div>`;
        html += `<div class="vocab-grid">`;
        lesson.vocab.forEach(v => {
          html += `<span class="vocab-item"><span class="hanzi">${v.hanzi}</span> <span class="pinyin">${v.pinyin}</span> <span class="meaning">${v.meaning}</span></span>`;
        });
        html += `</div>`;
      }

      // Grammar
      if (lesson.grammar && lesson.grammar.length > 0) {
        html += `<div class="section-title">🧩 Grammar (၈ခု) + ဥပမာ ၅ခု</div>`;
        lesson.grammar.forEach(g => {
          html += `<div class="grammar-block">`;
          html += `<div class="grammar-pattern">${g.pattern}</div>`;
          html += `<div style="margin-bottom: 6px; color:#3d5166;"><strong>ရှင်းလင်းချက် (မြန်မာ):</strong> ${g.description}</div>`;
          html += `<div class="example-list">`;
          g.examples.forEach(ex => {
            html += `<div class="example-item"><span class="hanzi">${ex.hanzi}</span> <span class="pinyin">${ex.pinyin}</span> <span class="meaning">${ex.meaning}</span></div>`;
          });
          html += `</div></div>`;
        });
      }

      // Exercises
      if (lesson.exercises && lesson.exercises.length > 0) {
        html += `<div class="section-title">✏️ Exercise (၈ခု) — ဖြေဆိုရန်</div>`;
        html += `<div class="exercise-area">`;
        lesson.exercises.forEach((ex, i) => {
          html += `<div class="exercise-question">${i+1}. ${ex.question}</div>`;
          html += `<div class="exercise-answer" data-answer="${ex.answer}">`;
          html += `<input type="text" placeholder="သင့်အဖြေ..." class="exInput">`;
          html += `<button class="checkBtn">စစ်ဆေးမည်</button>`;
          html += `<span class="feedback"></span>`;
          html += `</div>`;
        });
        html += `</div>`;
      }

      html += `</div>`;
      container.innerHTML = html;

      // Exercise events
      document.querySelectorAll('.exercise-answer').forEach(block => {
        const input = block.querySelector('.exInput');
        const btn = block.querySelector('.checkBtn');
        const feedback = block.querySelector('.feedback');
        const correctAns = block.dataset.answer;

        btn.addEventListener('click', function() {
          const userAns = input.value.trim();
          const isCorrect = userAns.toLowerCase() === correctAns.toLowerCase();
          feedback.classList.remove('correct-feedback', 'wrong-feedback');
          if (isCorrect) {
            feedback.textContent = `✅ မှန်ပါတယ်! (အဖြေ: ${correctAns})`;
            feedback.classList.add('correct-feedback');
          } else {
            feedback.textContent = `❌ မှားပါတယ်။ အဖြေမှန်က: ${correctAns}`;
            feedback.classList.add('wrong-feedback');
          }
        });
      });
    }

    function initSelect() {
      let options = '';
      for (let i = 1; i <= 20; i++) {
        const lesson = lessons[i];
        const title = lesson ? lesson.title : `Lesson ${i}`;
        options += `<option value="${i}">Lesson ${i} · ${title.split('·')[0].trim()}</option>`;
      }
      lessonSelect.innerHTML = options;
    }

    lessonSelect.addEventListener('change', function(e) {
      const val = parseInt(e.target.value);
      renderLesson(lessons[val]);
    });

    // Start with Lesson 1
    initSelect();
    renderLesson(lesson1);
  </script>
