    // ============================================================
    //  RENDER ENGINE
    // ============================================================
    const selectEl = document.getElementById('lessonSelect');
    const displayEl = document.getElementById('lessonDisplay');

    function renderLesson(lessonKey) {
        const lesson = lessons[lessonKey];
        if (!lesson) return;

        let html = `<h2 style="margin-top:0;color:#1a2f4e;">${lesson.title}</h2>`;
        html += `<p style="color:#2a5a7a;font-weight:500;">${lesson.description}</p>`;

        const sections = lesson.sections;

        // ---- Dialog ----
        if (sections.dialog) {
            const d = sections.dialog;
            html += `<div class="section-box"><h3>${d.title}</h3>`;
            if (d.description) html += `<p style="color:#2a5a7a;">${d.description}</p>`;
            html += `<div class="dialog-box">`;
            d.lines.forEach(line => {
                html += `<div class="dialog-line"><span class="ko">${line.ko}</span><span class="my">${line.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        // ---- Grammar sections (grammar1 to grammar5) ----
        for (let i = 1; i <= 5; i++) {
            const key = 'grammar' + i;
            const g = sections[key];
            if (!g) continue;

            html += `<div class="section-box"><h3>${g.title}</h3>`;
            if (g.description) html += `<p style="color:#2a5a7a;">${g.description}</p>`;
            html += `<div style="margin-top:8px;">`;
            g.examples.forEach(ex => {
                html += `<div class="example-line"><span class="ko">${ex.ko}</span><span class="my">${ex.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        // ---- Vocabulary ----
        if (sections.vocabulary) {
            const v = sections.vocabulary;
            html += `<div class="section-box"><h3>${v.title}</h3>`;
            html += `<div class="vocab-grid">`;
            v.items.forEach(item => {
                html += `<div class="vocab-item"><span class="vocab-ko">${item.ko}</span><span class="vocab-my">${item.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        displayEl.innerHTML = html;
    }

    // ---- Populate dropdown ----
    const lessonKeys = Object.keys(lessons);
    lessonKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = lessons[key].title;
        selectEl.appendChild(opt);
    });

    // ---- Initial render ----
    if (lessonKeys.length > 0) {
        selectEl.value = lessonKeys[0];
        renderLesson(lessonKeys[0]);
    }

    // ---- On change ----
    selectEl.addEventListener('change', function() {
        renderLesson(this.value);
    });
</script>
