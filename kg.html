        // ============================================================
        //  သင်က ဒီနေရာမှာ Day 3, Day 4, ... ဆက်ထည့်ပါ။
        //  ပုံစံမှာ -
        //  day3: {
        //      title: "ရက် ၃ – ...",
        //      description: "...",
        //      sections: {
        //          grammar1: { title: "၁။ ...", explanation: "...", examples: [["...", "..."], ...] },
        //          grammar2: { title: "၂။ ...", explanation: "...", examples: [["...", "..."], ...] },
        //          // ... grammar8 အထိ
        //      },
        //      vocabulary: [ { ko: "...", my: "..." }, ... ],
        //      exercises: [ "၁။ ...", "၂။ ...", ... ]
        //  }
        // ============================================================
    };

    // ============================================================
    //  RENDER LOGIC – Dynamic Dropdown
    // ============================================================

    const lessonSelect = document.getElementById('lessonSelect');
    const lessonDisplay = document.getElementById('lessonDisplay');

    // Populate dropdown from lessons keys (day1, day2, ...)
    const dayKeys = Object.keys(lessons);
    dayKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        // Display as "Day 1", "Day 2", ...
        const dayNum = key.replace('day', '');
        opt.textContent = `Day ${dayNum}`;
        lessonSelect.appendChild(opt);
    });

    function renderLesson(dayKey) {
        const data = lessons[dayKey];
        if (!data) {
            lessonDisplay.innerHTML = `<div style="padding:40px;text-align:center;color:#888;">📭 ဒီနေ့အတွက် ဒေတာမရှိသေးပါဘူး။</div>`;
            return;
        }

        let html = `<div style="font-size:1.8rem;color:#1a2f4e;margin-bottom:6px;">📚 ${data.title}</div>`;
        html += `<div style="color:#2a6d4e;font-weight:500;margin-bottom:20px;">${data.description}</div>`;

        // Render sections (grammars)
        const sectionKeys = Object.keys(data.sections);
        sectionKeys.forEach((key, idx) => {
            const section = data.sections[key];
            const highlight = idx % 2 === 0 ? '' : 'highlight';
            html += `<div class="section-box ${highlight}">`;
            html += `<h3>${section.title}</h3>`;
            if (section.explanation) {
                html += `<div style="background:#eef3fa;padding:10px 16px;border-radius:10px;margin:8px 0 12px;font-size:0.95rem;">📖 ${section.explanation}</div>`;
            }
            if (section.examples) {
                html += `<h4>📝 ဥပမာများ</h4>`;
                section.examples.forEach(ex => {
                    html += `<div class="example-line">`;
                    html += `<span class="example-ko">${ex[0]}</span>`;
                    html += `<span class="example-my">${ex[1]}</span>`;
                    html += `</div>`;
                });
            }
            html += `</div>`;
        });

        // Vocabulary
        if (data.vocabulary) {
            html += `<div class="section-box"><h3>📖 ဝေါဟာရ (Vocabulary)</h3><div class="vocab-grid">`;
            data.vocabulary.forEach(v => {
                html += `<div class="vocab-item"><span class="vocab-ko">${v.ko}</span><span class="vocab-my">${v.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        // Exercises
        if (data.exercises) {
            html += `<div class="section-box"><h3>✍️ လေ့ကျင့်ခန်း (Exercises)</h3>`;
            data.exercises.forEach(ex => {
                html += `<div class="exercise-item">${ex}</div>`;
            });
            html += `</div>`;
        }

        lessonDisplay.innerHTML = html;
    }

    lessonSelect.addEventListener('change', function() {
        renderLesson(this.value);
    });

    // Default load first day
    if (dayKeys.length > 0) {
        renderLesson(dayKeys[0]);
    }
</script>
