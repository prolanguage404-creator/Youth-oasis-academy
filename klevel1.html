const lessonSelect = document.getElementById('lessonSelect');
const lessonDisplay = document.getElementById('lessonDisplay');

// Populate dropdown from lessons keys
const lessonKeys = Object.keys(lessons);
lessonKeys.forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    const num = key.replace('lesson', '');
    opt.textContent = `Lesson ${num}`;
    lessonSelect.appendChild(opt);
});

function renderLesson(lessonKey) {
    const data = lessons[lessonKey];
    if (!data) {
        lessonDisplay.innerHTML = `<div style="padding:40px;text-align:center;color:#888;">📭 ဒီ Lesson အတွက် ဒေတာမရှိသေးပါဘူး။ ဆက်လက်ဖြည့်စွက်ပါမည်။</div>`;
        return;
    }

    let html = `<div style="font-size:1.8rem;color:#1a2f4e;margin-bottom:6px;">📚 ${data.title}</div>`;
    html += `<div style="color:#2a6d4e;font-weight:500;margin-bottom:20px;">${data.description}</div>`;

    // Dialog
    html += `<div class="section-box"><h3>${data.dialog.title}</h3>`;
    data.dialog.lines.forEach(line => {
        html += `<div class="dialog-line">`;
        html += `<span class="dialog-speaker">${line.speaker}</span>`;
        html += `<span class="dialog-ko">${line.ko}</span>`;
        html += `<span class="dialog-my">${line.my}</span>`;
        html += `</div>`;
    });
    html += `</div>`;

    // Grammars with Exercises
    html += `<div class="section-box"><h3>📖 Grammar (၅ ခု) + Exercises (၂၅ ခု)</h3>`;
    data.grammars.forEach((g, idx) => {
        const highlight = idx % 2 === 0 ? '' : 'highlight';
        html += `<div class="section-box ${highlight}" style="margin:10px 0;">`;
        html += `<h4>${idx+1}. ${g.name}</h4>`;
        html += `<div style="background:#eef3fa;padding:8px 14px;border-radius:8px;margin:6px 0;">📖 ${g.explanation}</div>`;
        html += `<div style="color:#a33b3b;font-weight:500;">예: ${g.example}</div>`;
        html += `<div style="margin-top:10px;"><strong>✍️ Exercises:</strong></div>`;
        g.exercises.forEach((ex, exIdx) => {
            html += `<div class="exercise-item grammar-ex">${exIdx+1}. ${ex}</div>`;
        });
        html += `</div>`;
    });
    html += `</div>`;

    // Vocabulary
    html += `<div class="section-box"><h3>📖 Vocabulary (၂၀ လုံး)</h3><div class="vocab-grid">`;
    data.vocabulary.forEach(v => {
        html += `<div class="vocab-item"><span class="vocab-ko">${v.ko}</span><span class="vocab-my">${v.my}</span></div>`;
    });
    html += `</div></div>`;

    lessonDisplay.innerHTML = html;
}

lessonSelect.addEventListener('change', function() {
    renderLesson(this.value);
});

// Default load Lesson 1
if (lessonKeys.length > 0) {
    renderLesson(lessonKeys[0]);
}
</script>
</body>
