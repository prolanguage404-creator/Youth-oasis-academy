    // ============================================================
    //  Render + Spinner
    // ============================================================
    const selectEl = document.getElementById('lessonSelect');
    const displayEl = document.getElementById('lessonDisplay');

    function renderLesson(lessonKey) {
        const lesson = lessons[lessonKey];
        if (!lesson) return;

        let html = `<div class="lesson-card-inner"><h2>${lesson.title}</h2><p style="font-size:1rem;color:#1f4e3a;">${lesson.description}</p>`;

        const sections = lesson.sections;

        // Dialog
        if (sections.dialog) {
            html += `<div class="section-box"><h3>${sections.dialog.title}</h3><p><em>${sections.dialog.description || ''}</em></p><div class="dialog-box">`;
            sections.dialog.lines.forEach(line => {
                html += `<div class="dialog-line"><span class="ko">${line.ko}</span><span class="my">${line.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        // Grammar 1–5
        for (let i = 1; i <= 5; i++) {
            const g = sections[`grammar${i}`];
            if (g) {
                html += `<div class="section-box"><h3>${g.title}</h3><p>${g.description}</p>`;
                g.examples.forEach(ex => {
                    html += `<div class="example-line"><span class="ko">${ex.ko}</span><span class="my">${ex.my}</span></div>`;
                });
                html += `</div>`;
            }
        }

        // Vocabulary (30)
        if (sections.vocabulary) {
            html += `<div class="section-box"><h3>${sections.vocabulary.title}</h3><div class="vocab-grid">`;
            sections.vocabulary.items.forEach(item => {
                html += `<div class="vocab-item"><span class="vocab-ko">${item.ko}</span><span class="vocab-my">${item.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        html += `</div>`;
        displayEl.innerHTML = html;
    }

    // Populate spinner
    function populateSpinner() {
        selectEl.innerHTML = '';
        for (const [key, val] of Object.entries(lessons)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = val.title;
            selectEl.appendChild(opt);
        }
        // default
        selectEl.value = 'lesson1';
        renderLesson('lesson1');
    }

    selectEl.addEventListener('change', function() {
        renderLesson(this.value);
    });

    populateSpinner();
</script>
