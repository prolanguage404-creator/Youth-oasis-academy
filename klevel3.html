    // ============================================================
    //  RENDER လုပ်ဆောင်ချက်
    // ============================================================
    function renderLesson(lessonKey) {
        const lesson = lessons[lessonKey];
        if (!lesson) return;

        const container = document.getElementById('lessonDisplay');
        let html = `<h2>${lesson.title}</h2><p style="color:#1f6e4a;">${lesson.description}</p>`;

        // Sections
        const sections = lesson.sections;
        // Dialog
        if (sections.dialog) {
            html += `<div class="section-box">
                <h3>${sections.dialog.title}</h3>
                <p><em>${sections.dialog.description}</em></p>
                <div class="dialog-box">`;
            sections.dialog.lines.forEach(line => {
                html += `<div class="dialog-line"><span class="ko">${line.ko}</span><span class="my">${line.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        // Grammar 1-5
        for (let i = 1; i <= 5; i++) {
            const g = sections[`grammar${i}`];
            if (g) {
                html += `<div class="section-box">
                    <h3>${g.title}</h3>
                    <p>${g.description}</p>`;
                g.examples.forEach(ex => {
                    html += `<div class="example-line"><span class="ko">${ex.ko}</span><span class="my">${ex.my}</span></div>`;
                });
                html += `</div>`;
            }
        }

        // Vocabulary
        if (sections.vocabulary) {
            html += `<div class="section-box">
                <h3>${sections.vocabulary.title}</h3>
                <div class="vocab-grid">`;
            sections.vocabulary.items.forEach(item => {
                html += `<div class="vocab-item"><span class="vocab-ko">${item.ko}</span><span class="vocab-my">${item.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        // Exercises
        if (sections.exercises) {
            html += `<div class="section-box">
                <h3>${sections.exercises.title}</h3>`;
            sections.exercises.items.forEach(ex => {
                html += `<div class="exercise-item">${ex.my} <span style="color:#2a5a7a;font-size:0.9rem;">(${ex.hint})</span></div>`;
            });
            html += `</div>`;
        }

        container.innerHTML = html;
    }

    // ============================================================
    //  SPINNER (Dropdown) ဖြည့်ရန်
    // ============================================================
    const select = document.getElementById('lessonSelect');
    const lessonKeys = Object.keys(lessons);
    lessonKeys.forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = lessons[key].title;
        select.appendChild(opt);
    });

    // Default ပြရန်
    if (lessonKeys.length > 0) {
        select.value = lessonKeys[0];
        renderLesson(lessonKeys[0]);
    }

    // အပြောင်းအလဲဖြစ်လျှင်
    select.addEventListener('change', (e) => {
        renderLesson(e.target.value);
    });
</script>
