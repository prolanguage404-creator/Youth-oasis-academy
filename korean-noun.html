      --border-color: #e0e0e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {

      color: var(--text-color);
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;

      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);

    h1 {

      color: var(--primary-color);
    }

      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 16px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.3s;
    }

    .search-box:focus {
      border-color: var(--primary-color);
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary-color);
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f1f5f9;
    }

    .korean-text {
      font-weight: bold;
      font-size: 1.1em;
      color: #2c3e50;
    }

    @media (max-width: 600px) {
      th, td {
        padding: 10px;
        font-size: 14px;
      }
    }

    // Render Table Data
    function renderTable(data) {
      const tableBody = document.getElementById('nounTableBody');
      tableBody.innerHTML = '';

      data.forEach((item, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${index + 1}</td>
          <td class="korean-text">${item.korean}</td>
          <td>${item.pronunciation}</td>
          <td>${item.meaning}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    // Search Filter Function
    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const filteredData = koreanNouns.filter(item => 
        item.korean.toLowerCase().includes(input) ||
        item.pronunciation.toLowerCase().includes(input) ||
        item.meaning.toLowerCase().includes(input)
      );
      renderTable(filteredData);
    }

    // Initialize Table on Load
    window.onload = () => {
      renderTable(koreanNouns);
    };
