function displayVerbs(data) {
    const container = document.getElementById('verbContainer');
    const stats = document.getElementById('stats');
    
    container.innerHTML = '';
    stats.textContent = `တွေ့ရှိသော အရေအတွက်: ${data.length} ခု`;

    if (data.length === 0) {
        container.innerHTML = '<div class="no-result">ရှာဖွေမှု အချက်အလက် မရှိပါ။</div>';
        return;
    }

    data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div class="card-header">
                <span class="korean">${item.korean}</span>
                <span class="id-badge">#${item.id}</span>
            </div>
            <div class="pronunciation">[ ${item.pronunciation} ]</div>
            <div class="meaning">${item.meaning}</div>
        `;
        container.appendChild(card);
    });
}

// Initial Render
displayVerbs(verbs);

// Search Functionality
document.getElementById('searchInput').addEventListener('input', function(e) {
    const keyword = e.target.value.toLowerCase().trim();
    
    const filtered = verbs.filter(item => 
        item.korean.toLowerCase().includes(keyword) ||
        item.pronunciation.toLowerCase().includes(keyword) ||
        item.meaning.toLowerCase().includes(keyword) ||
        item.id.toString().includes(keyword)
    );
    
    displayVerbs(filtered);
});
</script>
