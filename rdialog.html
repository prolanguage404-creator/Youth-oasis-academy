      explain: "လုပ်ငန်းပြီးဆုံးကြောင်းဖော်ပြ",
      examples: [

      { ru: "Хорошо. Ваша карта готова.", my: "ကောင်းပါတယ်။ ခင်ဗျားရဲ့ကတ် အဆင်သင့်ဖြစ်ပါပြီ။" },
      { ru: "Хорошо. Всё готово.", my: "ကောင်းပါတယ်။ အားလုံး အဆင်သင့်ဖြစ်ပါပြီ။" },
      { ru: "Хорошо. Ваш заказ принят.", my: "ကောင်းပါတယ်။ ခင်ဗျားရဲ့မှာယူမှုကို လက်ခံပါပြီ။" },
      { ru: "Хорошо. Ваша заявка оформлена.", my: "ကောင်းပါတယ်။ ခင်ဗျားရဲ့လျှောက်လွှာကို ပြုလုပ်ပြီးပါပြီ။" },
      ],
      vocab: [
      { ru: "готова", my: "အဆင်သင့်ဖြစ်တယ်" },
      { ru: "готово", my: "အဆင်သင့်ဖြစ်တယ်" },
      { ru: "принят", my: "လက်ခံပြီ" },
      { ru: "оформлена", my: "ပြုလုပ်ပြီ" },
      ]
      },
      {
      title: "Открыть (ဖွင့်သည်)",
      pattern: "Открыть + noun",
      explain: "ဖွင့်ခြင်းလုပ်ဆောင်ချက်",
      examples: [
      { ru: "Открыть счёт.", my: "အကောင့်ဖွင့်သည်။" },
      { ru: "Открыть карту.", my: "ကတ်ဖွင့်သည်။" },
      { ru: "Открыть вклад.", my: "ငွေစုအကောင့်ဖွင့်သည်။" },
      { ru: "Открыть бизнес.", my: "စီးပွားရေးလုပ်ငန်းဖွင့်သည်။" },
      { ru: "Открыть дверь.", my: "တံခါးဖွင့်သည်။" },
      ],
      vocab: [
      { ru: "открыть", my: "ဖွင့်သည်" },
      { ru: "карту", my: "ကတ်" },
      { ru: "вклад", my: "ငွေစုအကောင့်" },
      { ru: "бизнес", my: "စီးပွားရေးလုပ်ငန်း" },
      { ru: "дверь", my: "တံခါး" },
      ]
      },
      {
      title: "Счёт (အကောင့်)",
      pattern: "Счёт + adjective",
      explain: "အကောင့်အမျိုးအစား",
      examples: [
      { ru: "Текущий счёт.", my: "လက်ရှိအကောင့်။" },
      { ru: "Сберегательный счёт.", my: "ငွေစုအကောင့်။" },
      { ru: "Валютный счёт.", my: "ငွေကြေးအကောင့်။" },
      { ru: "Депозитный счёт.", my: "အပ်ငွေအကောင့်။" },
      { ru: "Банковский счёт.", my: "ဘဏ်အကောင့်။" },
      ],
      vocab: [
      { ru: "текущий", my: "လက်ရှိ" },
      { ru: "сберегательный", my: "ငွေစု" },
      { ru: "валютный", my: "ငွေကြေး" },
      { ru: "депозитный", my: "အပ်ငွေ" },
      { ru: "банковский", my: "ဘဏ်" },
      ]
      }
      ]
      }

      // ============================================================
      // 🔮 DIALOG 2..15 — ဆက်လက်ထည့်ရန် (ဤနေရာတွင်)
      // ============================================================
      // dialog2: { ... }, dialog3: { ... } ... dialog15
      // developer အနေဖြင့် အထက်ပါ dialog1 ပုံစံအတိုင်း ထပ်ထည့်ပါ။
      // သတိပြုရန် - grammar array တွင် အနည်းဆုံး 8 ခုထည့်ပါ။
    };

    // ============================================================
    // 📘 Developer guide (in code)
    // ============================================================
    /*
      dialog2 ထည့်နည်း ဥပမာ 
      dialog2: {
        header: "В кафе · ကော်ဖီဆိုင်",
        lines: [ ... ],
        grammar: [ { title: "...", pattern: "...", explain: "...", examples: [...], vocab: [...] }, ... 8 ]
      }
      ထိုနည်းတူ dialog3 မှ dialog15 အထိ ထည့်နိုင်သည်။
      စုစုပေါင်း grammar 8 ခုစီ၊ meaning (vocab) 50+ ပါရမည်။
    */

    // DOM
    const selectEl = document.getElementById('dialogSelect');
    const contentEl = document.getElementById('dialogContent');
    const badge = document.getElementById('currentDialogBadge');

    // count total vocab (meanings)
    function countVocab(dialogData) {
      let total = 0;
      if (dialogData && dialogData.grammar) {
        dialogData.grammar.forEach(g => {
          if (g.vocab) total += g.vocab.length;
        });
      }
      return total;
    }

    function renderDialog(dialogKey) {
      const data = dialogsData[dialogKey];
      if (!data) {
        contentEl.innerHTML = `
          <div style="background:#f3f7ff; border-radius:2rem; padding:3rem 1.5rem; text-align:center; border:1px dashed #90a9cf;">
            <div style="font-size:2.5rem;">📭</div>
            <div style="font-size:1.3rem; font-weight:500; color:#1f3d62;">${dialogKey} အတွက် Dialog ပြင်ဆင်နေပါသည်။</div>
            <div style="margin-top:0.6rem; color:#48658a;">(dialog + grammar 8 ခု၊ ဝေါဟာရ 50+ )</div>
          </div>
        `;
        badge.textContent = `📌 ${dialogKey.toUpperCase()}`;
        return;
      }

      const totalVocab = countVocab(data);
      let html = `<div style="background:#e5edf9; border-radius:40px; padding:0.3rem 1.8rem; display:inline-block; margin-bottom:1rem; font-weight:500; color:#0b2a4a;">🗣️ ${data.header}</div>`;

      // Dialog bubbles
      html += `<div class="dialog-bubble">`;
      data.lines.forEach(line => {
        html += `<div class="line">
          <span class="speaker">${line.speaker}</span>
          <span class="ru">${line.ru}</span>
          <span class="my">${line.my}</span>
        </div>`;
      });
      html += `</div>`;

      // Grammar blocks
      if (data.grammar && data.grammar.length) {
        data.grammar.forEach((g, idx) => {
          html += `<div class="grammar-block">`;
          html += `<div class="grammar-title">${g.title} <small>#${idx+1}</small></div>`;
          html += `<div class="pattern-box">📐 ${g.pattern} · ${g.explain}</div>`;
          html += `<ul class="example-list">`;
          g.examples.forEach(ex => {
            html += `<li><span class="ru">${ex.ru}</span> <span class="my">${ex.my}</span></li>`;
          });
          html += `</ul>`;
          if (g.vocab && g.vocab.length) {
            html += `<div class="mini-vocab"><strong>📖 မီးနင်း (${g.vocab.length} လုံး) ·</strong>`;
            g.vocab.forEach(v => {
              html += `<span class="vocab-item"><span class="ru">${v.ru}</span> <span class="my">${v.my}</span></span>`;
            });
            html += `</div>`;
          }
          html += `</div>`;
        });
      }

      html += `<div class="placeholder-note">✅ Dialog: ${data.header} · grammar ${data.grammar ? data.grammar.length : 0}/8 · ဝေါဟာရ စုစုပေါင်း ${totalVocab} လုံး (ရည်မှန်း 50+)</div>`;
      contentEl.innerHTML = html;
      badge.textContent = `📌 ${dialogKey.toUpperCase()}`;
    }

    // populate select options
    function updateSelect() {
      const currentVal = selectEl.value;
      selectEl.innerHTML = '';
      const keys = Object.keys(dialogsData);
      keys.forEach((key, i) => {
        const opt = document.createElement('option');
        opt.value = key;
        const num = key.replace('dialog', '');
        opt.textContent = `💬 Dialog ${num} · ${dialogsData[key].header || ''}`;
        selectEl.appendChild(opt);
      });
      if (keys.includes(currentVal)) selectEl.value = currentVal;
      else if (keys.length) selectEl.value = keys[0];
    }

    selectEl.addEventListener('change', function(e) {
      renderDialog(e.target.value);
    });

    // init
    updateSelect();
    renderDialog(selectEl.value);

  })();
</script>
</body>
