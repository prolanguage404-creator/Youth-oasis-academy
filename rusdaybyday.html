    description: "Russian Fairy Tale – Repka – မုန်လာဥကြီးပုံပြင်",
    sections: {
        intro: {
            title: "၁။ သင်ခန်းစာအကျဉ်းချုပ်",
            content: `
                <p>ဒီနေ့မှာ နာမည်ကြီး ရုရှားပုံပြင် <strong>Репка (မုန်လာဥကြီး)</strong> ကို ဖတ်ကြမယ်။</p>
                <p>ဒီပုံပြင်က <strong>အတူတူဆွဲခြင်း</strong> ရဲ့ အရေးပါမှုကို သင်ပေးတယ်။</p>
            `
        },
        story: {
            title: "၂။ ပုံပြင် – Репка",
            description: "ရုရှားပုံပြင် – မုန်လာဥကြီး",
            text: `
                <p><strong>Репка</strong></p>
                <p>Посадил дед репку. Выросла репка большая-пребольшая.</p>
                <p>Пошёл дед репку рвать. Тянет-потянет, вытянуть не может.</p>
                <p>Позвал дед бабку.</p>
                <p>Бабка за дедку, дедка за репку – тянут-потянут, вытянуть не могут.</p>
                <p>Позвала бабка внучку.</p>
                <p>Внучка за бабку, бабка за дедку, дедка за репку – тянут-потянут, вытянуть не могут.</p>
                <p>Позвала внучка Жучку.</p>
                <p>Жучка за внучку, внучка за бабку, бабка за дедку, дедка за репку – тянут-потянут, вытянуть не могут.</p>
                <p>Позвала Жучка кошку.</p>
                <p>Кошка за Жучку, Жучка за внучку, внучка за бабку, бабка за дедку, дедка за репку – тянут-потянут, вытянуть не могут.</p>
                <p>Позвала кошка мышку.</p>
                <p>Мышка за кошку, кошка за Жучку, Жучка за внучку, внучка за бабку, бабка за дедку, дедка за репку – тянут-потянут и вытянули репку!</p>
            `,
            translation: `
                <p><strong>မုန်လာဥကြီး</strong></p>
                <p>အဘိုးအို မုန်လာဥစိုက်တယ်။ မုန်လာဥက ကြီးလွန်းလှတယ်။</p>
                <p>အဘိုးအို မုန်လာဥဆွဲသွားတယ်။ ဆွဲလိုက်ဆွဲလိုက်၊ မနုတ်နိုင်ဘူး။</p>
                <p>အဘိုးအို အဘွားအိုကိုခေါ်တယ်။</p>
                <p>အဘွားအိုက အဘိုးအိုကိုဆွဲ၊ အဘိုးအိုက မုန်လာဥကိုဆွဲ – ဆွဲလိုက်ဆွဲလိုက်၊ မနုတ်နိုင်ဘူး။</p>
                <p>အဘွားအို မြေးမလေးကိုခေါ်တယ်။</p>
                <p>မြေးမလေးက အဘွားအိုကိုဆွဲ၊ အဘွားအိုက အဘိုးအိုကိုဆွဲ၊ အဘိုးအိုက မုန်လာဥကိုဆွဲ – ဆွဲလိုက်ဆွဲလိုက်၊ မနုတ်နိုင်ဘူး။</p>
                <p>မြေးမလေး ခွေးကြီးကိုခေါ်တယ်။</p>
                <p>ခွေးကြီးက မြေးမလေးကိုဆွဲ၊ မြေးမလေးက အဘွားအိုကိုဆွဲ၊ အဘွားအိုက အဘိုးအိုကိုဆွဲ၊ အဘိုးအိုက မုန်လာဥကိုဆွဲ – ဆွဲလိုက်ဆွဲလိုက်၊ မနုတ်နိုင်ဘူး။</p>
                <p>ခွေးကြီး ကြောင်ကိုခေါ်တယ်။</p>
                <p>ကြောင်က ခွေးကြီးကိုဆွဲ၊ ခွေးကြီးက မြေးမလေးကိုဆွဲ၊ မြေးမလေးက အဘွားအိုကိုဆွဲ၊ အဘွားအိုက အဘိုးအိုကိုဆွဲ၊ အဘိုးအိုက မုန်လာဥကိုဆွဲ – ဆွဲလိုက်ဆွဲလိုက်၊ မနုတ်နိုင်ဘူး။</p>
                <p>ကြောင် ကြွက်လေးကိုခေါ်တယ်။</p>
                <p>ကြွက်လေးက ကြောင်ကိုဆွဲ၊ ကြောင်က ခွေးကြီးကိုဆွဲ၊ ခွေးကြီးက မြေးမလေးကိုဆွဲ၊ မြေးမလေးက အဘွားအိုကိုဆွဲ၊ အဘွားအိုက အဘိုးအိုကိုဆွဲ၊ အဘိုးအိုက မုန်လာဥကိုဆွဲ – ဆွဲလိုက်ဆွဲလိုက်ပြီး မုန်လာဥကို နုတ်လိုက်နိုင်တယ်။</p>
            `
        },
        vocabulary: {
            title: "၃။ ပုံပြင်ထဲက ဝေါဟာရအသစ်များ",
            words: [
                { ru: "Посадил", my: "စိုက်ခဲ့တယ်" },
                { ru: "Выросла", my: "ကြီးထွားလာခဲ့တယ်" },
                { ru: "Тянет-потянут", my: "ဆွဲလိုက်ဆွဲလိုက်" },
                { ru: "Вытянуть", my: "နုတ်ထုတ်တယ်" },
                { ru: "Позвал/позвала", my: "ခေါ်ခဲ့တယ်" },
                { ru: "Дед", my: "အဘိုးအို" },
                { ru: "Бабка", my: "အဘွားအို" },
                { ru: "Внучка", my: "မြေးမလေး" },
                { ru: "Жучка", my: "ခွေးကြီး" },
                { ru: "Кошка", my: "ကြောင်" },
                { ru: "Мышка", my: "ကြွက်လေး" }
            ]
        },
        exercises: {
            title: "၄။ လေ့ကျင့်ခန်း",
            items: [
                "၁။ ပုံပြင်ကို ရုရှားလိုဖတ်ပါ။",
                "၂။ ပုံပြင်ထဲက ကြိယာ ၅ လုံးကို ရှာပါ။",
                "၃။ ပုံပြင်ရဲ့ သင်ခန်းစာက ဘာလဲ။"
            ]
        }
    }
},
day62: {
    title: "ရက် ၆၂ – စာပေဖတ်ခြင်း – ရုရှားပုံပြင် (၂) – Колобок",
    description: "Russian Fairy Tale – Kolobok – ပေါင်မုန့်လုံးလေး",
    sections: {
        intro: {
            title: "၁။ သင်ခန်းစာအကျဉ်းချုပ်",
            content: `
                <p>ဒီနေ့မှာ နာမည်ကြီး ရုရှားပုံပြင် <strong>Колобок (ပေါင်မုန့်လုံးလေး)</strong> ကို ဖတ်ကြမယ်။</p>
                <p>ဒီပုံပြင်က <strong>ယုံကြည်လွယ်ခြင်း</strong> ရဲ့ အန္တရာယ်ကို သင်ပေးတယ်။</p>
            `
        },
        story: {
            title: "၂။ ပုံပြင် – Колобок",
            description: "ရုရှားပုံပြင် – ပေါင်မုန့်လုံးလေး",
            text: `
                <p><strong>Колобок</strong></p>
                <p>Жили-были старик со старухой. Бабушка испекла колобок и положила на окно остывать.</p>
                <p>Колобок полежал, полежал и укатился.</p>
                <p>Катится колобок, а навстречу ему заяц. Заяц говорит: «Колобок, колобок, я тебя съем!»</p>
                <p>Колобок говорит: «Не ешь меня, я тебе песенку спою!» И запел колобок. Заяц отстал.</p>
                <p>Катится колобок, а навстречу ему волк. Волк говорит: «Колобок, колобок, я тебя съем!»</p>
                <p>Колобок спел песню и укатился.</p>
                <p>Катится колобок, а навстречу ему медведь. Медведь говорит: «Колобок, колобок, я тебя съем!»</p>
                <p>Колобок опять спел песню и укатился.</p>
                <p>Катится колобок, а навстречу ему лиса. Лиса сказала: «Колобок, спой мне песенку!»</p>
                <p>Колобок запел, а лиса съела его!</p>
            `,
            translation: `
                <p><strong>ပေါင်မုန့်လုံးလေး</strong></p>
                <p>အဘိုးအိုနဲ့ အဘွားအိုတစ်ယောက် ရှိခဲ့တယ်။ အဘွားအိုက ပေါင်မုန့်လုံးလေးကို ဖုတ်ပြီး ပြတင်းပေါက်မှာ အေးအောင်ထားလိုက်တယ်။</p>
                <p>ပေါင်မုန့်လုံးလေး အိပ်လိုက်အိပ်လိုက် လှိမ့်ထွက်သွားတယ်။</p>
                <p>ပေါင်မုန့်လုံးလေး လှိမ့်သွားတယ်၊ ပြီးတော့ ယုန်တစ်ကောင်က သူ့ကို ကြိုဆိုလာတယ်။ ယုန်က ပြောတယ်။ 'ပေါင်မုန့်လုံးလေး၊ ပေါင်မုန့်လုံးလေး၊ မင်းကို ငါစားမယ်!'</p>
                <p>ပေါင်မုန့်လုံးလေးက ပြောတယ်။ 'ငါ့ကို မစားနဲ့၊ ငါ မင်းကို သီချင်းဆိုပြမယ်!' ပြီးတော့ ပေါင်မုန့်လုံးလေး သီချင်းဆိုလိုက်တယ်။ ယုန်က နောက်ကျသွားတယ်။</p>
                <p>ပေါင်မုန့်လုံးလေး လှိမ့်သွားတယ်၊ ပြီးတော့ ဝံပုလွေတစ်ကောင်က သူ့ကို ကြိုဆိုလာတယ်။ ဝံပုလွေက ပြောတယ်။ 'ပေါင်မုန့်လုံးလေး၊ ပေါင်မုန့်လုံးလေး၊ မင်းကို ငါစားမယ်!'</p>
                <p>ပေါင်မုန့်လုံးလေး သီချင်းဆိုပြီး လှိမ့်ထွက်သွားတယ်။</p>
                <p>ပေါင်မုန့်လုံးလေး လှိမ့်သွားတယ်၊ ပြီးတော့ ဝက်ဝံတစ်ကောင်က သူ့ကို ကြိုဆိုလာတယ်။ ဝက်ဝံက ပြောတယ်။ 'ပေါင်မုန့်လုံးလေး၊ ပေါင်မုန့်လုံးလေး၊ မင်းကို ငါစားမယ်!'</p>
                <p>ပေါင်မုန့်လုံးလေး နောက်တစ်ခါ သီချင်းဆိုပြီး လှိမ့်ထွက်သွားတယ်။</p>
                <p>ပေါင်မုန့်လုံးလေး လှိမ့်သွားတယ်၊ ပြီးတော့ မြေခွေးတစ်ကောင်က သူ့ကို ကြိုဆိုလာတယ်။ မြေခွေးက ပြောတယ်။ 'ပေါင်မုန့်လုံးလေး၊ ငါ့ကိုသီချင်းဆိုပြပါ!'</p>
                <p>ပေါင်မုန့်လုံးလေး သီချင်းဆိုတယ်၊ ပြီးတော့ မြေခွေးက သူ့ကို စားလိုက်တယ်!</p>
            `
        },
        vocabulary: {
            title: "၃။ ပုံပြင်ထဲက ဝေါဟာရအသစ်များ",
            words: [
                { ru: "Испекла", my: "ဖုတ်ခဲ့တယ်" },
                { ru: "Положила", my: "ထားခဲ့တယ်" },
                { ru: "Остывать", my: "အေးအောင်ထားတယ်" },
                { ru: "Укатился", my: "လှိမ့်ထွက်သွားတယ်" },
                { ru: "Катится", my: "လှိမ့်သွားတယ်" },
                { ru: "Навстречу", my: "ကြိုဆိုတယ်" },
                { ru: "Съем", my: "စားမယ်" },
                { ru: "Спою", my: "ဆိုပြမယ်" },
                { ru: "Отстал", my: "နောက်ကျသွားတယ်" },
                { ru: "Опять", my: "နောက်တစ်ခါ" },
                { ru: "Заяц", my: "ယုန်" },
                { ru: "Волк", my: "ဝံပုလွေ" },
                { ru: "Медведь", my: "ဝက်ဝံ" },
                { ru: "Лиса", my: "မြေခွေး" }
            ]
        },
        exercises: {
            title: "၄။ လေ့ကျင့်ခန်း",
            items: [
                "၁။ ပုံပြင်ကို ရုရှားလိုဖတ်ပါ။",
                "၂။ ပုံပြင်ထဲက တိရစ္ဆာန် ၄ ကောင်ရဲ့ အမည်ကို ရေးပါ။",
                "၃။ ပုံပြင်ရဲ့ သင်ခန်းစာက ဘာလဲ။"

    }

day63: {
    title: "ရက် ၆၃ – စာပေဖတ်ခြင်း – ရုရှားပုံပြင် (၃) – Курочка Ряба",
    description: "Russian Fairy Tale – Ryaba the Hen – ကြက်မရယ်ဗါ",
    sections: {
        intro: {
            title: "၁။ သင်ခန်းစာအကျဉ်းချုပ်",
            content: `
                <p>ဒီနေ့မှာ နာမည်ကြီး ရုရှားပုံပြင် <strong>Курочка Ряба (ကြက်မရယ်ဗါ)</strong> ကို ဖတ်ကြမယ်။</p>
                <p>ဒီပုံပြင်က <strong>အကောင်းဆုံးက ရိုးရိုးရှင်းရှင်းပါပဲ</strong> ဆိုတာကို သင်ပေးတယ်။</p>
            `
        },
        story: {
            title: "၂။ ပုံပြင် – Курочка Ряба",
            description: "ရုရှားပုံပြင် – ကြက်မရယ်ဗါ",
            text: `
                <p><strong>Курочка Ряба</strong></p>
                <p>Жили-были дед и баба. У них была курочка Ряба.</p>
                <p>Снесла курочка яичко, да не простое, а золотое.</p>
                <p>Дед бил-бил яйцо – не разбил.</p>
                <p>Баба била-била – не разбила.</p>
                <p>Мышка бежала, хвостиком махнула, яичко упало и разбилось.</p>
                <p>Дед плачет, баба плачет, а курочка кудахчет: «Не плачь, дед, не плачь, баба! Я снесу вам новое яичко, не золотое, а простое.»</p>
            `,
            translation: `
                <p><strong>ကြက်မရယ်ဗါ</strong></p>
                <p>အဘိုးအိုနဲ့ အဘွားအိုတစ်ယောက် ရှိခဲ့တယ်။ သူတို့မှာ ရယ်ဗါဆိုတဲ့ ကြက်မတစ်ကောင် ရှိခဲ့တယ်။</p>
                <p>ကြက်မက ဥတစ်လုံး ဥလိုက်တယ်၊ သာမန်မဟုတ်ဘဲ ရွှေဥပါ။</p>
                <p>အဘိုးအို ဥကို ရိုက်လိုက်ရိုက်လိုက် — မကွဲဘူး။</p>

    // ---------- POPULATE SPINNER ----------
    const select = document.getElementById('lessonSelect');
    Object.keys(lessons).forEach(key => {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = lessons[key].title;
        select.appendChild(opt);
    });

    // ---------- RENDER FUNCTION ----------
    function renderLesson(lessonKey) {
        const data = lessons[lessonKey];
        if (!data) return;

        const display = document.getElementById('lessonDisplay');

        let html = `<h2 style="color:#1a2f4e;">${data.title}</h2>`;
        html += `<p style="font-size:1.05rem; color:#2a4a6e;">${data.description}</p>`;

        if (data.sections) {
            Object.keys(data.sections).forEach(sectionKey => {
                const section = data.sections[sectionKey];
                html += `<div class="section-box">`;
                html += `<h3>${section.title}</h3>`;

                if (section.content) {
                    html += `<div>${section.content}</div>`;
                }

                if (section.points) {
                    html += `<ul style="list-style:none;padding-left:0;">`;
                    section.points.forEach(p => {
                        html += `<li style="padding:4px 0; border-bottom:1px dashed #e8ecf2;">${p}</li>`;
                    });
                    html += `</ul>`;
                }

                if (section.description) {
                    html += `<p>${section.description}</p>`;
                }

                if (section.groups) {
                    section.groups.forEach(group => {
                        html += `<h4>${group.name}</h4>`;
                        html += `<div class="alphabet-grid">`;
                        group.letters.forEach(l => {
                            html += `<div class="alphabet-item">${l.letter}</div>`;
                        });
                        html += `</div>`;
                    });
                }

                if (section.examples) {
                    section.examples.forEach(ex => {
                        html += `<div class="example-line"><span class="ru">${ex.ru}</span><span class="my">${ex.my}</span></div>`;
                    });
                }

                if (section.table) {
                    html += `<table class="case-table"><thead><tr>`;
                    section.table.headers.forEach(h => {
                        html += `<th>${h}</th>`;
                    });
                    html += `</tr></thead><tbody>`;
                    section.table.rows.forEach(row => {
                        html += `<tr>`;
                        row.forEach(cell => {
                            html += `<td>${cell}</td>`;
                        });
                        html += `</tr>`;
                    });
                    html += `</tbody></table>`;
                }

                if (section.note) {
                    html += `<div class="note">${section.note}</div>`;
                }

                if (section.items) {
                    section.items.forEach(item => {
                        html += `<div class="exercise-item">${item}</div>`;
                    });
                }

                html += `</div>`;
            });
        }

        if (data.vocabulary && data.vocabulary.length > 0) {
            html += `<div class="section-box" style="border-left-color:#2a7a8a;"><h3>📚 အဘိဓာန် (Vocabulary)</h3><div class="vocab-grid">`;
            data.vocabulary.forEach(v => {
                html += `<div class="vocab-item"><span class="vocab-ru">${v.ru}</span><span class="vocab-my">${v.my}</span></div>`;
            });
            html += `</div></div>`;
        }

        if (data.exercises && data.exercises.length > 0) {
            html += `<div class="section-box" style="border-left-color:#4a8a4e;"><h3>✍️ လေ့ကျင့်ခန်း (Exercises)</h3>`;
            data.exercises.forEach(ex => {
                html += `<div class="exercise-item">${ex}</div>`;
            });
            html += `</div>`;
        }

        display.innerHTML = html;
    }

    // ---------- INITIAL ----------
    renderLesson('day1');
    select.addEventListener('change', (e) => {
        renderLesson(e.target.value);
    });
</script>
