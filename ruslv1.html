        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = lessons[key].title;
        select.appendChild(opt);
    });

    // ---------- RENDER FUNCTION ----------
    function renderLesson(lessonKey) {
        const data = lessons[lessonKey];
        if (!data) return;

        const display = document.getElementById('lessonDisplay');

        let html = `<h2 style="color:#1e3c72;">${data.title}</h2>`;

        // Dialog
        html += `<div class="dialog-block"><h3 style="margin-top:0;">💬 Dialog</h3>`;
        data.dialog.forEach(line => {
            html += `<div class="dialog-line">
                        <span class="ru">${line.ru}</span>
                        <span class="my">${line.my}</span>
                     </div>`;
        });
        html += `</div>`;

        // Grammar (with examples)
        html += `<div class="grammar-box"><h3>📖 Grammar (၈ ချက်) — တစ်ခုချင်းစီမှာ ဥပမာ ၅ ခုစီ</h3>`;
        data.grammar.forEach(g => {
            html += `<div class="grammar-item">
                        <strong>${g.title}</strong> — ${g.desc}
                        <div class="example-list">
                            <ul style="margin:5px 0; padding-left: 0;">
                    `;
            g.examples.forEach(ex => {
                const parts = ex.split('→');
                html += `<li><span class="ru-ex">${parts[0].trim()}</span> → <span class="my-ex">${parts[1] ? parts[1].trim() : ''}</span></li>`;
            });
            html += `   </ul>
                        </div>
                     </div>`;
        });
        html += `</div>`;

        // Vocabulary 30
        html += `<div class="vocab-box"><h3>📚 အဘိဓာန် (Vocabulary ၃၀) — Russian → မြန်မာ</h3>
                 <div class="vocab-grid">`;
        data.vocabulary.forEach(v => {
            html += `<div class="vocab-item">
                        <span class="vocab-ru">${v.ru}</span>
                        <span class="vocab-my">${v.my}</span>
                     </div>`;
        });
        html += `</div></div>`;

        // Questions 8
        html += `<div class="question-box"><h3>❓ မေးခွန်း (၈ ခု) — ဖြေပါ</h3>`;
        data.questions.forEach((q, idx) => {
            html += `<div class="question-item">${q}</div>`;
        });
        html += `</div>`;

        display.innerHTML = html;
    }

    // ---------- INITIAL ----------
    renderLesson('lesson1');
    select.addEventListener('change', (e) => {
        renderLesson(e.target.value);
    });
