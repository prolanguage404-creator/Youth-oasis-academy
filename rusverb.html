        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const tableBody = document.getElementById('tableBody');
        const matchCount = document.getElementById('matchCount');

        // Render verbs with partial match (contains)
        function renderAll(searchTerm = '') {
            const term = searchTerm.trim();
            const lowerTerm = term.toLowerCase();

            let html = '';
            let matchCountNum = 0;
            let matchedItems = [];

            verbs.forEach(item => {
                // Check if term is empty OR matches partial in Russian OR Myanmar meaning
                const matchRussian = lowerTerm === '' || item.russian.toLowerCase().includes(lowerTerm);
                const matchMeaning = lowerTerm === '' || item.meaning.toLowerCase().includes(lowerTerm);
                const isMatch = matchRussian || matchMeaning;

                if (isMatch) {
                    matchCountNum++;
                    matchedItems.push(item);
                }
            });

            // If no match and term is not empty
            if (term !== '' && matchCountNum === 0) {
                html = `
                    <tr class="not-found-row">
                        <td colspan="3">🔍 “${term}” နဲ့ ဆက်စပ်တဲ့ စာလုံး မတွေ့ပါ။ နောက်တစ်မျိုး စမ်းကြည့်ပါ။</td>
                    </tr>
                `;
                matchCount.textContent = '';
            } else {
                // Build rows for matched items
                matchedItems.forEach(item => {
                    const isHighlight = term !== '' && 
                        (item.russian.toLowerCase().includes(lowerTerm) || 
                         item.meaning.toLowerCase().includes(lowerTerm));
                    const rowClass = isHighlight ? 'highlight-row' : '';
                    html += `
                        <tr class="${rowClass}">
                            <td class="russian-word">${item.russian}</td>
                            <td class="meaning-cell">${item.meaning}</td>
                            <td><span class="badge-web">✅ ကြိယာ</span></td>
                        </tr>
                    `;
                });

                // Show match count
                if (term !== '') {
                    matchCount.textContent = `📌 တွေ့ရှိမှု: ${matchCountNum} ခု`;
                } else {
                    matchCount.textContent = `📌 စုစုပေါင်း: ${verbs.length} ခု`;
                }
            }

            tableBody.innerHTML = html;
        }

        // Search function
        function performSearch() {
            const query = searchInput.value;
            renderAll(query);
        }

        // Reset: show all without highlight
        function resetAll() {
            searchInput.value = '';
            renderAll('');
        }

        // Events
        searchBtn.addEventListener('click', performSearch);
        resetBtn.addEventListener('click', resetAll);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });

        // Initial render: show all
        window.addEventListener('DOMContentLoaded', () => {
            renderAll('');
        });
    })();
</script>
